name: Build

# Baut das Programm für macOS und Windows. Ist die Version (tauri.conf.json) neu,
# wird sie in diesem (öffentlichen) Repo als Release veröffentlicht; die installierten
# Programme bieten sie dann über „Neue Version verfügbar“ an.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/osm-lookup.yml"
      - ".github/workflows/check.yml"
      - ".github/workflows/map-sizes.yml"
      - ".github/workflows/roads-test.yml"
      - ".github/workflows/maps.yml"
      - "scripts/build-packs.sh"
      - "tools/build_packs_manifest.py"
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOWNLOAD_REPO: ${{ github.repository }}

jobs:
  # Nur bauen, wenn die Version neu ist (spart Speicher für Zwischenkopien)
  version:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "v$VERSION" --repo "$DOWNLOAD_REPO" >/dev/null 2>&1; then
            echo "Version $VERSION ist schon veröffentlicht – kein Bau nötig."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

  fonts:
    name: Schriften
    needs: version
    if: needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: fonts-out
          key: fonts-v1-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - name: Laden
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-fonts.sh fonts-out
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: fonts-out
          retention-days: 1

  build:
    name: Programm (${{ matrix.name }})
    needs: fonts
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-14
            bundles: app,dmg
          - name: windows
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fonts
          path: public

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten
        run: npm install

      - name: Programmsymbole erzeugen
        run: npx tauri icon app-icon.png

      - name: Bauen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt in diesem Repo"; fi
          # Spracherkennung (whisper.cpp): unter Windows nicht auf die CPU des Build-Servers optimieren
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CMAKE_PROJECT_INCLUDE_BEFORE="$(cygpath -m "$PWD/src-tauri/ggml-portabel.cmake")"
          fi
          # Piper (sherpa-onnx): Paket selbst holen (der Rust-Cache überspringt sonst den Download)
          SHERPA_TAG=v1.12.15
          if [ "$RUNNER_OS" = "Windows" ]; then SHERPA_PAKET="sherpa-onnx-$SHERPA_TAG-win-x64-shared"; else SHERPA_PAKET="sherpa-onnx-$SHERPA_TAG-osx-universal2-static"; fi
          # laden und entpacken (nur relative Pfade – unter Windows versteht tar keine Laufwerksbuchstaben)
          mkdir -p sherpa-paket
          fehler=$( { curl -fsSL -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$SHERPA_TAG/$SHERPA_PAKET.tar.bz2" && \
            { tar -xjf sherpa.tar.bz2 -C sherpa-paket || { 7z x -y sherpa.tar.bz2 -so | 7z x -y -si -ttar -osherpa-paket; }; }; } 2>&1 ) || echo "::error::sherpa-Paket: ${fehler:0:400}"
          export SHERPA_LIB_PATH="$PWD/sherpa-paket/$SHERPA_PAKET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export SHERPA_LIB_PATH="$(cygpath -w "$SHERPA_LIB_PATH")"
            # die DLLs liegen neben dem Programm und werden mit installiert
            mkdir -p src-tauri/target/release
            echo "::notice::Paket: $(cd "sherpa-paket/$SHERPA_PAKET" && find . -maxdepth 2 | head -40 | tr '\n' ' ')"
            find "sherpa-paket/$SHERPA_PAKET" -iname '*.dll' -exec cp {} src-tauri/target/release/ \;
            echo "::notice::DLLs: $(cd src-tauri/target/release && ls *.dll | tr '\n' ' ')"
          fi
          npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # letzte Zeilen als Anmerkung, damit der Fehler ohne Log-Download lesbar ist
            grep -iE "error|failed|panicked|invalid|password|key" build.log | tail -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ $status -eq 0 ]; then
            exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
            echo "::notice::Im Installer: $(7z l "$exe" 2>/dev/null | grep -io '[a-z0-9_.-]*\.dll' | sort -u | tr '\n' ' ')"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: LeitWerk-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 1

  release:
    name: Veröffentlichen
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: LeitWerk-*
          path: out
          merge-multiple: true

      - name: Veröffentlichen, falls neue Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$DOWNLOAD_REPO" >/dev/null 2>&1; then
            echo "Version $VERSION ist schon veröffentlicht – nichts zu tun."
            exit 0
          fi
          find out -type f | sort
          python3 tools/release_notes.py "$VERSION" > notes.md
          MAC="$(find out -name '*.app.tar.gz' | head -1)"
          WIN="$(find out -name '*-setup.exe' | head -1)"
          DMG="$(find out -name '*.dmg' | head -1)"
          # Dateinamen ohne Leerzeichen (GitHub ersetzt sie sonst)
          url() { echo "https://github.com/$DOWNLOAD_REPO/releases/download/$TAG/$(basename "$1")"; }
          jq -n --arg v "$VERSION" --rawfile notes notes.md \
            --arg macsig "$(cat "$MAC.sig")" --arg macurl "$(url "$MAC")" \
            --arg winsig "$(cat "$WIN.sig")" --arg winurl "$(url "$WIN")" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $macsig, url: $macurl},
               "windows-x86_64": {signature: $winsig, url: $winurl}}}' > latest.json
          cat latest.json
          gh release create "$TAG" --repo "$DOWNLOAD_REPO" --title "LeitWerk $VERSION" \
            --notes-file notes.md --latest \
            "$MAC" "$WIN" "$DMG" latest.json

      # Zwischenkopien älterer Läufe löschen (die Dateien liegen ja im Release);
      # so bleibt der kostenlose Speicher für GitHub Actions frei
      - name: Alte Zwischenkopien löschen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null && echo "gelöscht: $id"
          done
