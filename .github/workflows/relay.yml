name: Relay

# Veröffentlicht den Multiplayer-Relay auf Cloudflare (server.leitwerk.workers.dev)
# und prüft ihn danach mit einem automatischen Test.
on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
      - name: Testen
        run: |
          sleep 5
          curl -fsS https://server.leitwerk.workers.dev/
          echo
          node relay/test/relay-test.mjs wss://server.leitwerk.workers.dev 2>&1 | tee relay-test.txt
          exit ${PIPESTATUS[0]}
      - name: Ergebnis als Anmerkung
        if: always()
        run: |
          [ -f relay-test.txt ] && while IFS= read -r l; do echo "::notice::$l"; done < relay-test.txt || true
