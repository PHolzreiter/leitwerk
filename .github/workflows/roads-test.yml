name: Straßennetz-Test

# Hilfswerkzeug: baut Straßennetz und Adressen je Bundesland, fügt sie zusammen (tools/roadtest)
# und legt Größen und Testrouten im Branch "lookups" ab.
on:
  workflow_dispatch:
    inputs:
      regionen:
        description: "Bundesländer (noe wien bgld ooe stmk)"
        default: "noe wien bgld ooe stmk"

permissions:
  contents: write

jobs:
  roads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: |
          sudo apt-get update -q && sudo apt-get install -yq osmium-tool
          pip install --quiet osmium numpy shapely
          curl -fsSL -o austria.osm.pbf https://download.geofabrik.de/europe/austria-latest.osm.pbf
          /usr/bin/time -v bash scripts/build-regionen.sh austria.osm.pbf out ${{ inputs.regionen }} 2>&1 | tee report.txt
      - name: Zusammenfügen und Routen testen
        run: |
          cd tools/roadtest && cargo build --release -q
          echo "### alle Länder" | tee -a ../../report.txt
          ./target/release/roadtest ../../out/roads-*.lwrg.gz 2>&1 | tee -a ../../report.txt
          echo "### nur NÖ und Wien" | tee -a ../../report.txt
          ./target/release/roadtest ../../out/roads-noe.lwrg.gz ../../out/roads-wien.lwrg.gz 2>&1 | tee -a ../../report.txt || true
          zcat ../../out/addresses-wien.tsv.gz | head -5 >> ../../report.txt || true
      - name: Ablegen
        if: always()
        run: |
          git init -q store && cd store
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin lookups; then git checkout -q -b lookups FETCH_HEAD; else git checkout -q --orphan lookups; fi
          cp ../report.txt roads_report.txt
          git add -A && git commit -qm "Straßennetz-Test" && git push -q origin HEAD:lookups
