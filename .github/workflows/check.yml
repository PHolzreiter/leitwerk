name: Prüfen

# Schnelle Prüfung bei jedem Push: TypeScript, Oberfläche bauen, Rust kompilieren.
# (Ohne Kartendaten, daher deutlich schneller als der volle Build.)
# Die Ausgaben landen zusätzlich im Branch "ci-logs" (check-<branch>.log).
on:
  push:
    branches-ignore: [lookups, ci-logs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04  # 26.04 bricht whisper-rs-sys (bindgen-Layout), siehe 0.45.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Systempakete
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PAKETE="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libgl-dev"
          for v in 1 2 3; do
            timeout 300 sudo apt-get $APT update -q && timeout 600 sudo apt-get $APT install -yq $PAKETE && exit 0
            echo "apt-Versuch $v fehlgeschlagen, neuer Versuch"; sleep 10
          done
          exit 1
      - name: Prüfen
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/check.log"; : > "$LOG"
          run() { echo "### $*" | tee -a "$LOG"; "$@" 2>&1 | tee -a "$LOG"; }
          status=0
          run npm install || status=1
          run npm run build || status=1
          run npx tauri icon app-icon.png || status=1
          (cd src-tauri && run cargo check) || status=1
          run cmake -S tools/xplane-plugin -B xpbau -DCMAKE_BUILD_TYPE=Release || status=1
          run cmake --build xpbau -j4 || status=1
          run python3 tools/build_default_data.py || status=1
          run python3 tools/build_stufen.py || status=1
          run python3 tools/leitwerk_codesystem.py data/codesystem/leitwerk_codesystem.json || status=1
          run python3 tools/beispiel_codesystem.py data/beispiele/beispiel_codesystem.json || status=1
          run git diff --stat --exit-code data/ || status=1
          echo "### Ergebnis: $status" | tee -a "$LOG"
          exit $status
      - name: Protokoll ablegen
        if: always()
        run: |
          BR="${GITHUB_REF_NAME//\//_}"
          git init -q store && cd store
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          cp ../check.log "check-$BR.log" 2>/dev/null || echo "kein Protokoll" > "check-$BR.log"
          rm -rf "dist-$BR" && cp -R ../dist "dist-$BR" 2>/dev/null || true
          # Laufzeit-Pakete (ohne Build-Werkzeuge) für lokale Testbuilds, nur wenn sich package.json ändert
          H=$(sha1sum ../package.json | cut -c1-10)
          if [ ! -f "vendor-$H.tgz" ] && [ -d ../node_modules ]; then
            rm -f vendor-*.tgz
            tar -czf "vendor-$H.tgz" -C .. --exclude='node_modules/typescript' --exclude='node_modules/vite' --exclude='node_modules/rollup' \
              --exclude='node_modules/@rollup' --exclude='node_modules/esbuild' --exclude='node_modules/@esbuild' --exclude='node_modules/@tauri-apps/cli*' \
              --exclude='node_modules/.cache' node_modules
          fi
          git add -A && git commit -qm "check $BR ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-logs
