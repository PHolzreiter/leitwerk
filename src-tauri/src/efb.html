  Beide Tablets zeigen diese Seite gleich; nur die H145 antwortet auf {leitwerk:"stand"} (Zeile „Funkgerät & Tablet“).
  Läuft im Simulator in einem alten Browser („Coherent GT“): kein CSS-Grid, keine CSS-Variablen, kein calc(), kein gap,
  JavaScript ohne neuere Schreibweisen (var, function, keine Pfeile, keine Vorlagen-Texte).

-->

  .feld { width: 100%; height: 40px; border: 1px solid #2A2F3A; border-radius: 8px; background: #111216; color: #F5F7FA; padding: 0 10px; font-size: 14px; font-family: inherit; margin-bottom: 8px; }
  .chips button { display: inline-block; margin: 0 6px 6px 0; }
  .khk { display: flex; align-items: center; padding: 9px 11px; border: 1px solid #2A2F3A; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .khk.gew { border-color: #3B8BFF; background: rgba(59,139,255,0.12); }
  .radio { width: 16px; height: 16px; border-radius: 8px; border: 2px solid #9AA3B5; flex: none; margin-right: 10px; }
  .radio.an { border-color: #3B8BFF; background: #3B8BFF; box-shadow: inset 0 0 0 3px #1A1D24; }
  .khk .t { flex: 1; min-width: 0; }
  .merk span { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 5px; background: #20242A; color: #C4CAD6; margin: 4px 4px 0 0; }
  .merk span.ok { background: rgba(76,195,138,0.12); color: #4CC38A; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; margin-left: 8px; }
  .pill.ok { background: rgba(76,195,138,0.12); color: #4CC38A; }
  .pill.gelb { background: rgba(255,199,44,0.1); color: #FFD866; }
  .pill.rot { background: rgba(229,72,77,0.1); color: #FF7A7E; }
  .prim { width: 100%; height: 46px; border: 0; border-radius: 10px; background: #3B8BFF; color: #111216; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .frage { padding: 12px; border-radius: 10px; background: #20242A; margin-top: 10px; }
  .frage div { margin-bottom: 10px; font-size: 14px; }
  .frage button { margin-right: 6px; }
  .stk button { display: inline-block; vertical-align: top; width: 31.3%; margin: 0 1% 8px; height: 70px; border-radius: 10px; border: 2px solid #2A2F3A; background: #1E2129; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .stk button span { display: block; font-size: 24px; line-height: 30px; }
  /* Navigation (große Karte) */
  .nav { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #0E0F12; }
  .nav .karte { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; border-radius: 0; border: 0; }
  .nav .bk { height: 52px; display: flex; align-items: center; padding: 0 10px; background: #13151A; border-bottom: 1px solid #23262F; }
  .nav .bk b { flex: 1; font-size: 15px; margin-left: 6px; }
  .nk { border: 1px solid #2A2F3A; border-radius: 8px; background: #1E2129; color: #F5F7FA; font-size: 13px; font-weight: 600; padding: 8px 11px; cursor: pointer; margin-left: 6px; }
  .nk.on { background: #3B8BFF; color: #111216; border-color: #3B8BFF; }
  .zoom { position: absolute; right: 10px; top: 64px; }
  .zoom button { display: block; width: 44px; height: 44px; margin-bottom: 6px; border: 0; border-radius: 9px; background: rgba(17,18,22,0.88); color: #F5F7FA; font-size: 22px; font-weight: 700; cursor: pointer; }
  .tabzeile { position: absolute; left: 14px; right: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="kopf"><div class="h"><b id="heli">LeitWerk</b><span id="unter">verbinde …</span></div><span class="uhr" id="uhr"></span><button class="stpkt" id="stpkt" aria-label="Status geben"><i id="stfarbe" style="background:#6B7385"></i></button></div>
  <div class="tabv versteckt" id="tabv"><b id="tabvT">Funkgerät &amp; Tablet</b><span id="tabvU"></span><button id="tabvB">Verbinden</button></div>
  <div class="seg versteckt" id="seg"><span class="m" id="segm"></span><button id="segT" class="on">Transport</button><button id="segP">Patient<span class="dot versteckt" id="patdot"></span></button></div>
  <div class="inh" id="inh">
    <div class="leer" id="leer"><div class="t" id="leerT">Kein Alarm</div><div id="leerU">Neue Einsätze erscheinen hier automatisch.</div><div class="st versteckt" id="leerSt"></div></div>
    <div id="transport" class="versteckt"></div>
    <div id="patient" class="versteckt"></div>
  </div>
  <button class="knopf versteckt" id="buchenK">Zielort buchen</button>
  <div id="blatt" class="versteckt"><div class="dunkel" id="blattZu"></div><div class="blatt" id="blattBox"><div class="bk"><b id="blattT">Zielort buchen</b><button id="blattX">Schließen ✕</button></div><div class="bi" id="blattI"></div></div></div>
  <div id="nav" class="nav versteckt"><div class="bk"><button class="nk" id="navZu">‹ Zurück</button><b id="navT">Navigation</b><button class="nk" id="navAlle">Alle Fahrzeuge</button><button class="nk" id="navFolgen">Folgen</button></div><div class="karte" id="navK"></div><div class="zoom"><button id="zplus">+</button><button id="zminus">−</button></div></div>
</div>
<script>
(function () {
  var stand = {};
  var tab = "transport";
  var patGesehen = "";
  var blattArt = "";
  var khWahl = "";
  var khFuer = "";
  var frageOffen = null;
  var suchFeld = null;
  var suchTimer = 0;
  var suchOffen = false;
  var selbstBuchen = false;
  var navAuf = false;
  var letzt = "";
  var KACHEL = "https://mapsneu.wien.gv.at/basemap/geolandbasemap/normal/google3857/";

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function zeige(el, an) { if (an) el.className = el.className.replace(/ ?versteckt/g, ""); else if (!/versteckt/.test(el.className)) el.className += " versteckt"; }
  function senden(cmd) {
    var x = new XMLHttpRequest();
    x.open("POST", "/befehl");
    x.onreadystatechange = function () { if (x.readyState === 4) setTimeout(holen, 200); };
    try { x.send(cmd); } catch (e) {}
  }

  // ------------------------------------------------------------ Karte (Kacheln von basemap.at, Norden oben)
  function Karte(box, klein) {
    this.box = box; this.klein = klein; this.z = 12; this.lat = 48.4; this.lon = 15.6; this.folgen = true; this.imgs = {};
    box.innerHTML = '<div class="kach"></div><div class="mk"></div>' + (klein ? '<div class="info"></div><div class="gross">Navigation ›</div>' : '<div class="info versteckt"></div>') + '<div class="quelle">Datenquelle: basemap.at</div>';
    this.kach = box.childNodes[0]; this.mk = box.childNodes[1]; this.info = box.childNodes[2];
    var k = this;
    if (!klein) {
      var zieh = null;
      box.onmousedown = function (ev) { zieh = { x: ev.clientX, y: ev.clientY, px: k.px(k.lat, k.lon) }; k.folgen = false; knopfFolgen(); };
      box.onmousemove = function (ev) {
        if (!zieh) return;
        var nx = zieh.px.x - (ev.clientX - zieh.x), ny = zieh.px.y - (ev.clientY - zieh.y);
        var ll = k.ll(nx, ny); k.lat = ll.lat; k.lon = ll.lon; k.zeichnen();
      };
      box.onmouseup = box.onmouseleave = function () { zieh = null; };
      box.onwheel = function (ev) { k.zoom(ev.deltaY < 0 ? 1 : -1); ev.preventDefault(); };
    }
  }
  Karte.prototype.px = function (lat, lon) {
    var n = 256 * Math.pow(2, this.z);
    var s = Math.sin(lat * Math.PI / 180);
    return { x: (lon + 180) / 360 * n, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n };
  };
  Karte.prototype.ll = function (x, y) {
    var n = 256 * Math.pow(2, this.z);
    var lon = x / n * 360 - 180;
    var m = Math.PI - 2 * Math.PI * y / n;
    return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(m) - Math.exp(-m))), lon: lon };
  };
  Karte.prototype.zoom = function (d) { this.z = Math.max(7, Math.min(18, this.z + d)); this.zeichnen(); };
  Karte.prototype.passend = function (a, b) {
    // Ausschnitt so, dass beide Punkte drin sind
    var w = this.box.clientWidth || 500, h = this.box.clientHeight || 170;
    this.lat = (a.lat + b.lat) / 2; this.lon = (a.lon + b.lon) / 2;
    for (var z = 16; z >= 7; z--) {
      this.z = z;
      var p = this.px(a.lat, a.lon), q = this.px(b.lat, b.lon);
      if (Math.abs(p.x - q.x) < w - 70 && Math.abs(p.y - q.y) < h - 60) break;
    }
  };
  Karte.prototype.zeichnen = function () {
    var w = this.box.clientWidth, h = this.box.clientHeight;
    if (!w || !h) return;
    var c = this.px(this.lat, this.lon);
    var x0 = c.x - w / 2, y0 = c.y - h / 2;
    var n = Math.pow(2, this.z);
    var neu = {};
    for (var tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + w) / 256); tx++) {
      for (var ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + h) / 256); ty++) {
        if (ty < 0 || ty >= n) continue;
        var key = this.z + "/" + ty + "/" + ((tx % n) + n) % n;
        var img = this.imgs[key];
        if (!img) { img = document.createElement("img"); img.src = KACHEL + key + ".png"; img.alt = ""; this.kach.appendChild(img); }
        img.style.left = Math.round(tx * 256 - x0) + "px"; img.style.top = Math.round(ty * 256 - y0) + "px";
        neu[key] = img;
      }
    }
    for (var k in this.imgs) if (!neu[k]) this.kach.removeChild(this.imgs[k]);
    this.imgs = neu;
    this.x0 = x0; this.y0 = y0;
    this.marken();
  };
  Karte.prototype.pos = function (lat, lon) { var p = this.px(lat, lon); return { x: Math.round(p.x - this.x0), y: Math.round(p.y - this.y0) }; };
  Karte.prototype.marken = function () {
    var d = this.daten;
    if (!d || !d.ich) { this.mk.innerHTML = ""; return; }
    var h = "", i, p;
    var ich = this.pos(d.ich.lat, d.ich.lon);
    if (d.ziel) {
      var z = this.pos(d.ziel.lat, d.ziel.lon);
      var dx = z.x - ich.x, dy = z.y - ich.y, len = Math.sqrt(dx * dx + dy * dy), w = Math.atan2(dy, dx) * 180 / Math.PI;
      h += '<div class="m-linie" style="left:' + ich.x + "px;top:" + ich.y + "px;width:" + Math.round(len) + "px;-webkit-transform:rotate(" + w + "deg);transform:rotate(" + w + 'deg)"></div>';
    }
    var fz = d.fz || [];
    var label = this.z >= 11 || this.klein;
    for (i = 0; i < fz.length; i++) {
      p = this.pos(fz[i].lat, fz[i].lon);
      if (p.x < -20 || p.y < -20 || p.x > this.box.clientWidth + 20 || p.y > this.box.clientHeight + 20) continue;
      h += '<div class="m-fz' + (fz[i].nah ? " nah" : "") + '" style="left:' + p.x + "px;top:" + p.y + "px;background:" + esc(fz[i].f) + '"></div>';
      if (label && (fz[i].ein || fz[i].nah || this.z >= 12)) h += '<div class="m-lbl" style="left:' + p.x + "px;top:" + p.y + 'px">' + esc(fz[i].ruf) + "</div>";
    }
    if (d.ziel) {
      p = this.pos(d.ziel.lat, d.ziel.lon);
      h += '<div class="m-ziel' + (d.ziel.kh ? " kh" : "") + '" style="left:' + p.x + "px;top:" + p.y + 'px">' + (d.ziel.kh ? "H" : "") + "</div>";
    }
    var rund = d.ich.kurs === null || d.ich.kurs === undefined;
    var rot = rund ? "" : "-webkit-transform:rotate(" + d.ich.kurs + "deg);transform:rotate(" + d.ich.kurs + "deg);";
    h += '<div class="m-ich' + (rund ? " rund" : "") + '" style="left:' + ich.x + "px;top:" + ich.y + "px;" + rot + '"><div>' + (rund ? "" : '<i style="border-bottom-color:' + esc(d.ich.f) + '"></i>') + "</div></div>";
    this.mk.innerHTML = h;
    if (this.info) {
      var nv = d.nav;
      this.info.innerHTML = nv ? "→ " + esc(nv.kurs) + "° · " + esc(nv.km) + " · " + esc(nv.min) + (nv.an ? " <span>an " + esc(nv.an) + "</span>" : "") : esc(d.text || (d.ziel ? d.ziel.t : ""));
      zeige(this.info, !!(nv || d.text || (d.ziel && !this.klein)));
    }
  };
  Karte.prototype.setzen = function (d) {
    this.daten = d;
    if (!d || !d.ich) return;
    if (this.klein) {
      if (d.ziel) this.passend(d.ich, d.ziel); else { this.lat = d.ich.lat; this.lon = d.ich.lon; this.z = 12; }
    } else if (this.folgen) { this.lat = d.ich.lat; this.lon = d.ich.lon; }
    this.zeichnen();
  };

  var kleineKarte = null;
  var grosseKarte = new Karte($("navK"), false);
  function knopfFolgen() { $("navFolgen").className = "nk" + (grosseKarte.folgen ? " on" : ""); }

  // ------------------------------------------------------------ Zeichnen
  function zeichnen(s) {
    var t = (s.neu || {}).tab || {};
    $("heli").textContent = t.heli || s.heli || "LeitWerk";
    $("unter").textContent = t.unter || s.unter || s.hinweis || "";
    $("uhr").textContent = t.uhr || "";
    $("stfarbe").style.background = t.st ? t.st.f : "#6B7385";
    var ein = t.ein;
    zeige($("seg"), !!ein);
    zeige($("leer"), !ein);
    var oben = $("tabv").className.indexOf("versteckt") < 0 ? 96 : 56;
    $("seg").style.top = (oben + 10) + "px";
    $("inh").style.top = (ein ? oben + 60 : oben) + "px";
    if (!ein) {
      $("leerT").textContent = t.st ? "Kein Alarm" : "Kein Hubschrauber";
      $("leerU").textContent = t.st ? "Neue Einsätze erscheinen hier automatisch." : (t.unter || "im Piloten-Interface wählen");
      var ls = $("leerSt");
      zeige(ls, !!t.st);
      if (t.st) { ls.style.background = t.st.f; ls.innerHTML = "<b>" + esc(t.st.n) + "</b>" + esc(t.st.t); }
      zeige($("transport"), false); zeige($("patient"), false); zeige($("buchenK"), false);
      if (blattArt === "buchen") blattZu();
      return;
    }
    // Reiter
    if (!t.pat && tab === "patient") tab = "transport";
    $("segm").className = "m" + (tab === "patient" ? " r" : "");
    $("segT").className = tab === "transport" ? "on" : "";
    $("segP").className = tab === "patient" ? "on" : "";
    var pk = t.pat ? JSON.stringify(t.pat.liste || []) : "";
    if (tab === "patient") patGesehen = pk;
    zeige($("patdot"), !!t.pat && pk !== patGesehen);
    zeige($("transport"), tab === "transport");
    zeige($("patient"), tab === "patient");
    zeige($("buchenK"), tab === "transport");
    $("inh").className = "inh" + (tab === "transport" ? " mitknopf" : "");
    transportZeichnen(t);
    patientZeichnen(t);
    var bk = $("buchenK");
    bk.className = "knopf" + (t.buchenDa ? "" : " aus") + (tab === "transport" ? "" : " versteckt");
    bk.innerHTML = t.plan ? "Zielort ändern<small>" + esc(t.plan) + "</small>" : t.buchenDa ? "Zielort buchen ›" : "Zielort buchen<small>" + esc(t.buchenText || "geht am Einsatzort") + "</small>";
    if (blattArt === "buchen") { if (t.buchenDa) buchenZeichnen(); else blattZu(); }
    if (blattArt === "status") statusZeichnen();
    if (navAuf) { grosseKarte.setzen(t.karte); $("navAlle").className = "nk" + (t.karte && t.karte.alle ? " on" : ""); }
  }

  var GS_SCHRITTE = ["Alarm", "Bereitstellungsraum", "Abruf", "Einsatzort", "Patient"];
  function gsZeichnen(g) {
    var h = '<div class="gsk"><div class="gsk-auf' + (g.abruf ? " abruf" : "") + '"><small>' + (g.abruf ? "Abruf durch die Einsatzleitung" : "Dein Auftrag") + "</small><b>" + esc(g.auftrag) + "</b>" +
      (g.abruf && g.abruf.pct ? '<div class="balken"><i style="width:' + esc(g.abruf.pct) + '%"></i></div>' : "") + "</div>";
    h += '<div class="schritte">';
    for (var i = 0; i < GS_SCHRITTE.length; i++) h += '<span class="' + (i < g.schritt ? "ok" : i === g.schritt ? "jetzt" : "") + '">' + (i < g.schritt ? "✓ " : "") + GS_SCHRITTE[i] + "</span>";
    h += '</div><div class="gsw">';
    for (i = 0; i < (g.werte || []).length; i++) h += "<div><span>" + esc(g.werte[i].l) + "</span><b>" + esc(g.werte[i].v) + "</b></div>";
    return h + "</div></div>";
  }

  function transportZeichnen(t) {
    var e = t.ein, h = "", i;
    if (t.alarm) {
      var q = null, kn = stand.knoepfe || [];
      for (i = 0; i < kn.length; i++) if (kn[i].nummer === "9") q = kn[i];
      h += '<div class="alarmb">ALARM<small>' + esc(t.alarm.zeit) + "</small>" + (t.alarm.quitt ? '<span class="q">Status 9 – quittiert</span>' : q ? '<button data-akt="' + esc(q.aktion) + '">9 Quittieren</button>' : "") + "</div>";
    }
    h += '<div class="ab"><div class="code">' + '<div class="code-k">' + (e.stufe ? '<span class="stufe" style="background:' + esc(e.sf) + '">' + esc(e.stufe) + "</span>" : "") +
      '<span class="code-nr">' + esc(e.code) + '</span></div><div class="code-n">' + esc(e.sw) + "</div>" + (e.zi ? '<div class="code-d">' + esc(e.zi) + "</div>" : "") + "</div>" +
      (e.gs && !t.gs ? '<div class="gs">' + esc(e.gs) + "</div>" : "") +
      '<div class="reihe"><span class="lbl">Ort</span><div class="w"><b>' + esc(e.adr) + "</b></div></div>" +
      (e.zusatz ? '<div class="reihe"><span class="lbl">Zusatz</span><div class="w">' + esc(e.zusatz) + "</div></div>" : "") +
      (t.gs ? gsZeichnen(t.gs) : "") +
      '<div class="karte klein" id="kk"></div></div>';
    if (t.gs && t.gs.zahlen) {
      h += '<div class="ab"><span class="lbl">Lage am Einsatzort</span><div class="zahlen">';
      for (i = 0; i < t.gs.zahlen.length; i++) h += '<div style="border-top-color:' + esc(t.gs.zahlen[i].f) + '"><b>' + esc(t.gs.zahlen[i].n) + "</b><small>" + esc(t.gs.zahlen[i].t) + "</small></div>";
      h += "</div></div>";
    }
    if (t.gs && t.gs.liste) {
      h += '<div class="ab"><span class="lbl">Bereitstellungsraum <span>· Reihenfolge des Abrufs</span></span><div class="wsl">';
      for (i = 0; i < t.gs.liste.length; i++) { var r = t.gs.liste[i]; h += '<div class="' + esc(r.c) + '"><span>' + esc(r.nr) + "</span><b>" + esc(r.t) + "</b><small>" + esc(r.z) + "</small></div>"; }
      h += "</div></div>";
    }
    if (t.gs && t.gs.meld && t.gs.meld.length) {
      h += '<div class="ab"><span class="lbl">Lagemeldungen <span>· Funk ' + esc(t.gs.gruppe) + '</span></span><div class="meld">';
      for (i = 0; i < t.gs.meld.length; i++) h += "<div><span>" + esc(t.gs.meld[i].z) + "</span>" + esc(t.gs.meld[i].t) + "</div>";
      h += "</div></div>";
    }
    var f = t.fz || [];
    var a = t.abf || [];
    if (f.length) {
      h += '<div class="ab"><span class="lbl">Alarmierte Fahrzeuge <span>· ' + f.length + "</span></span>";
      for (i = 0; i < f.length; i++) {
        h += '<div class="fz' + (f[i].funk ? " funk" : "") + (f[i].ich ? " ich" : "") + '" style="background:' + esc(f[i].f) + '"><span class="s">' + esc(f[i].s) + '</span><div class="t"><b>' + esc(f[i].ruf) + '</b><span class="ty">' + esc(f[i].typ) + '</span><span class="z">' + esc(f[i].txt) + "</span></div>" + (f[i].eta ? '<span class="e">' + esc(f[i].eta) + "</span>" : "") + "</div>";
      }
      h += "</div>";
    }
    if (!t.gs) h += '<div class="ab ohne"><span class="lbl">Abfrage' + (a.length ? " <span>· " + a.length + " beantwortet</span>" : "") + "</span>";
    if (t.gs) {} else if (a.length) {
      h += '<div class="erl">';
      for (i = 0; i < a.length; i++) h += "<div>" + (a[i].f ? "<small>" + esc(a[i].f) + "</small>" : "") + "<b>" + esc(a[i].a) + "</b></div>";
      h += "</div>";
    } else h += '<div class="hinweis">Keine Notrufabfrage zu diesem Einsatz.</div>';
    if (!t.gs) h += "</div>";
    var box = $("transport");
    var sig = JSON.stringify([t.alarm, e, f, a, t.gs]);
    if (box.getAttribute("data-sig") !== sig) {
      box.setAttribute("data-sig", sig);
      box.innerHTML = h;
      kleineKarte = new Karte($("kk"), true);
      $("kk").onclick = function () { navOeffnen(); };
      var akt = box.querySelectorAll("[data-akt]");
      for (i = 0; i < akt.length; i++) akt[i].onclick = function () { senden(this.getAttribute("data-akt")); };
    }
    if (kleineKarte) kleineKarte.setzen(t.karte);
  }

  var SICHT = { rot: "I", gelb: "II", "grün": "III", tot: "–" };
  var PUNKT = ["#4CC38A", "#FFC72C", "#FF5A5F"];
  function patientZeichnen(t) {
    var box = $("patient"), h = "", i, j;
    if (!t.pat) {
      h = '<div class="ab ohne"><div class="hinweis">' + esc(t.patZu || "Was der Patient hat, siehst du, sobald ihr beim Patienten seid.") + "</div></div>";
    } else {
      var p = t.pat, l = p.liste || [];
      for (i = 0; i < l.length; i++) {
        var x = l[i];
        h += '<div class="ab"><div class="pk"><div class="pk-band" style="background:' + esc(x.sf) + ";color:" + esc(x.sc || "#FFFFFF") + '"><b>' + esc(SICHT[x.s] || "") + "</b>Sichtung " + esc(x.s) + "<span>" + esc(x.nr || (l.length > 1 ? "Patient " + (i + 1) : "")) + "</span></div>";
        h += '<div class="pk-in"><div class="pk-wer">' + esc(x.wer || x.t) + "</div>" + (x.rolle ? '<div class="zeit" style="margin-top:2px">' + esc(x.rolle) + "</div>" : "");
        if (x.muster) h += '<div class="pk-vd"><small>Verletzungsmuster / Krankheitsbild</small><b>' + esc(x.muster) + "</b></div>";
        if (x.vd) h += '<div class="pk-vd"><small>Verdacht</small><b>' + esc(x.vd) + "</b></div>";
        var vit = x.vit || [];
        if (vit.length) {
          h += '<div class="vit">';
          for (j = 0; j < vit.length; j++) h += "<div><small>" + esc(vit[j].k) + '</small><b><i style="background:' + PUNKT[vit[j].g || 0] + '"></i>' + esc(vit[j].w) + "</b></div>";
          h += "</div>";
        }
        // Lagebild in Befund und Empfehlung (Transport …) aufteilen
        var teile = String(x.lage || "").split(/,\s*/), bef = [], empf = [];
        for (j = 0; j < teile.length; j++) { var tx = teile[j].replace(/^\s+|\s+$/g, ""); if (!tx) continue;
          var doppelt = false;
          for (var v2 = 0; v2 < vit.length; v2++) if (tx.toLowerCase() === String(vit[v2].w).toLowerCase()) doppelt = true;
          if (doppelt) continue; tx = tx.charAt(0).toUpperCase() + tx.slice(1); if (/transport|klinik|stroke|herzkatheter|schockraum|krankenhaus/i.test(tx)) empf.push(tx); else bef.push(tx); }
        if (bef.length) { h += '<div class="befund"><small>Befund</small>'; for (j = 0; j < bef.length; j++) h += "<div>" + esc(bef[j]) + "</div>"; h += "</div>"; }
        if (empf.length) h += '<div class="empf"><small>Empfehlung</small>' + esc(empf.join(" · ")) + "</div>";
        var fk = x.fakt || [];
        if (fk.length) {
          h += '<div class="befund fakt"><small>Vor Ort festgestellt</small>';
          for (j = 0; j < fk.length; j++) h += "<div><span>" + esc(fk[j].k) + '</span><b class="' + esc(fk[j].c || "") + '">' + esc(fk[j].w) + "</b></div>";
          h += "</div>";
        }
        if (x.fw) h += '<div class="warn">Erst nach Befreiung bzw. Rettung durch die Feuerwehr erreichbar</div>';
        if (x.bit) h += '<div class="warn">Sehr schwer (ca. 150 kg+) – Transport braucht BIT</div>';
        if (x.versorgt) h += '<div class="empf"><small>Versorgung</small>' + esc(x.versorgt) + "</div>";
        h += "</div></div></div>";
      }
      if (!l.length) h += '<div class="ab"><div class="pk"><div class="pk-in"><div class="pk-wer">' + esc(p.verdacht ? "Verdacht: " + p.verdacht : "Keine weiteren Angaben") + "</div></div></div></div>";
      h += '<div class="ab"><span class="lbl">Zielort</span><div class="ziel"><div class="w">' + (t.plan ? esc(t.plan) + "<small>gebucht</small>" : "Noch nicht entschieden<small>Transport und Krankenhaus festlegen</small>") + '</div><button id="patBuchen" class="' + (t.buchenDa ? "" : "aus") + '">' + (t.plan ? "Ändern" : "Zielort buchen") + "</button></div></div>";
      if (p.meldung) h += '<div class="ab"><span class="lbl">Notruf</span><div class="zitat">„' + esc(p.meldung) + "“</div></div>";
      var vl = p.verlauf || [];
      if (vl.length) {
        h += '<div class="ab ohne"><span class="lbl">Verlauf</span><div class="tl">';
        for (i = vl.length - 1; i >= 0; i--) h += "<div><span>" + esc(vl[i].z) + "</span>" + esc(vl[i].t) + "</div>";
        h += "</div></div>";
      }
    }
    if (box.getAttribute("data-sig") !== h) {
      box.setAttribute("data-sig", h);
      box.innerHTML = h;
      if ($("patBuchen")) $("patBuchen").onclick = function () { if (((stand.neu || {}).tab || {}).buchenDa) blattAuf("buchen"); };
    }
  }

  // ------------------------------------------------------------ Blätter: Status, Buchen
  function blattAuf(art) { blattArt = art; zeige($("blatt"), true); frageOffen = null; if (art === "buchen") buchenZeichnen(); else statusZeichnen(); }
  function blattZu() { blattArt = ""; frageOffen = null; suchFeld = null; zeige($("blatt"), false); }
  $("blattZu").onclick = blattZu;
  $("blattX").onclick = blattZu;
  $("stpkt").onclick = function () { if (blattArt === "status") blattZu(); else blattAuf("status"); };

  function statusZeichnen() {
    $("blattT").textContent = "Status geben";
    $("blattBox").className = "blatt kurz";
    var kn = stand.knoepfe || [], h = '<div class="stk">', i;
    for (i = 0; i < kn.length; i++) h += '<button data-akt="' + esc(kn[i].aktion) + '" style="border-color:' + esc(kn[i].farbe) + (kn[i].aktiv ? ";background:" + esc(kn[i].farbe) + ";color:#111216" : "") + '"><span>' + esc(kn[i].nummer) + "</span>" + esc(kn[i].name) + "</button>";
    h += "</div>";
    var bi = $("blattI");
    if (bi.getAttribute("data-sig") !== h) {
      bi.setAttribute("data-sig", h);
      bi.innerHTML = h;
      var b = bi.querySelectorAll("[data-akt]");
      for (i = 0; i < b.length; i++) b[i].onclick = function () { senden(this.getAttribute("data-akt")); setTimeout(blattZu, 250); };
    }
  }

  function buchenZeichnen() {
    $("blattT").textContent = "Zielort buchen";
    $("blattBox").className = "blatt";
    var b = (stand.neu || {}).ent, bi = $("blattI"), h = "", i, k;
    if (!b) { bi.innerHTML = '<div class="hinweis">Buchen geht, sobald ihr beim Patienten seid.</div>'; bi.setAttribute("data-sig", ""); return; }
    if (khFuer !== b.fuer) { khFuer = b.fuer; khWahl = ""; selbstBuchen = false; }
    var gefunden = false;
    for (i = 0; i < b.khs.length; i++) if (b.khs[i].id === khWahl) gefunden = true;
    if (!gefunden) { khWahl = ""; for (i = 0; i < b.khs.length; i++) if (b.khs[i].id === b.gebuchtId) khWahl = b.gebuchtId; if (!khWahl && b.khs[0]) khWahl = b.khs[0].id; }
    h += '<span class="lbl">Was passiert mit dem Patienten?</span><div class="wahl">';
    for (i = 0; i < b.wahl.length; i++) h += '<button class="' + (b.wahl[i].on ? "on" : "") + '" data-bu="seite:' + esc(b.wahl[i].id) + '"><b>' + esc(b.wahl[i].t) + "</b><small>" + esc(b.wahl[i].d) + "</small></button>";
    h += "</div>";
    if (b.keinWahl) {
      h += '<div class="wahl drei">';
      for (i = 0; i < b.keinWahl.length; i++) h += '<button class="' + (b.keinWahl[i].on ? "on" : "") + '" data-kein="' + esc(b.keinWahl[i].id) + '" data-t="' + esc(b.keinWahl[i].t) + '"><b>' + esc(b.keinWahl[i].t) + "</b><small>" + esc(b.keinWahl[i].s) + "</small></button>";
      h += "</div>";
    }
    if (b.rtwFehlt) h += '<div class="hinweis">Noch kein RTW im Einsatz – bitte bei der Leitstelle anfordern.</div>';
    var zeigSchritte = b.buchen;
    if (b.rtwWahl) {
      h += '<span class="lbl" style="margin-top:6px">Wer bucht das Krankenhaus?</span><div class="wahl"><button class="' + (b.rtwWahl.on ? "on" : "") + '" data-bu="rtwbucht"><b>Übergeben – RTW bucht selbst</b><small>' + (b.rtwWahl.on ? "erledigt · RTW sucht das Krankenhaus" : "ihr seid danach frei") + '</small></button><button class="' + (selbstBuchen || b.gebuchtId ? "on" : "") + '" id="selbstB"><b>Selbst buchen</b><small>Krankenhaus für den RTW wählen</small></button></div>';
      zeigSchritte = b.buchen && (selbstBuchen || !!b.gebuchtId);
    }
    if (zeigSchritte) {
      h += '<span class="lbl" style="margin-top:8px">Krankenhaus' + (b.gebuchtId ? ' <span class="pill ok">gebucht ' + esc(b.gebuchtT) + "</span>" : "") + "</span>";
      for (i = 0; i < b.schritte.length; i++) {
        k = b.schritte[i];
        if (k.fertig) h += '<div class="fertig"><span class="n">✓</span><span class="w"><small>' + esc(k.titel) + "</small>" + esc(k.wert) + '</span><button class="kn" data-bu="schritt:' + esc(k.nr) + '">Ändern</button></div>';
        else if (k.offen) h += '<div class="offen"><span>' + esc(k.nr) + "</span>" + esc(k.titel) + "</div>";
        else {
          h += '<div class="skopf"><span>' + esc(k.nr) + "</span>" + esc(k.frage) + "</div>";
          var j;
          if (k.istAlter) { h += '<div class="wahl drei">'; for (j = 0; j < b.altW.length; j++) h += '<button class="' + (b.altW[j].on ? "on" : "") + '" data-bu="alter:' + esc(b.altW[j].id) + '"><b>' + esc(b.altW[j].t) + "</b><small>" + esc(b.altW[j].s) + "</small></button>"; h += "</div>"; }
          if (k.istDringlich) { h += '<div class="wahl drei">'; for (j = 0; j < b.drW.length; j++) h += '<button class="' + (b.drW[j].on ? "on" : "") + (b.drW[j].aus ? " aus" : "") + '" data-bu="dring:' + esc(b.drW[j].id) + '"><b>' + esc(b.drW[j].t) + "</b><small>" + esc(b.drW[j].s) + "</small></button>"; h += "</div>"; }
          if (k.istSymptom) {
            h += '<div class="such' + (suchOffen ? " offen" : "") + '" id="such"><div id="suchplatz"></div><div class="dd">' + (b.symHinweis ? "<small>" + esc(b.symHinweis) + "</small>" : "");
            for (j = 0; j < b.symW.length; j++) h += '<button data-bu="sym:' + esc(b.symW[j].id) + '">' + esc(b.symW[j].t) + "</button>";
            if (!b.symW.length && !b.symHinweis) h += '<div class="nix">Kein Symptom gefunden.</div>';
            h += "</div></div>";
          }
          if (k.istVorschlag) {
            if (b.khLeer) h += '<div class="hinweis" style="margin-bottom:8px">' + esc(b.khLeer) + "</div>";
            for (j = 0; j < b.khs.length; j++) {
              var x = b.khs[j], merk = "";
              for (var m = 0; m < (x.merk || []).length; m++) merk += '<span class="' + esc(x.merk[m].c) + '">' + esc(x.merk[m].t) + "</span>";
              h += '<div class="khk' + (x.id === khWahl ? " gew" : "") + '" data-kh="' + esc(x.id) + '"><span class="radio' + (x.id === khWahl ? " an" : "") + '"></span><div class="t"><b>' + esc(x.n) + '</b> <span class="zeit">· ' + esc(x.km) + esc(x.min) + '</span><div class="merk">' + merk + "</div></div>" + (x.frei ? '<span class="' + esc(String(x.freiCls || "").replace(/^.*\b(ok|gelb|rot)\b.*$/, "pill $1")) + '">' + esc(x.frei) + "</span>" : "") + "</div>";
            }
            var gew = null;
            for (j = 0; j < b.khs.length; j++) if (b.khs[j].id === khWahl) gew = b.khs[j];
            if (gew) h += '<button class="prim" id="khok">' + esc(gew.n) + (b.gebuchtId === gew.id ? " gebucht" : " buchen") + "</button>";
          }
        }
      }
    }
    if (frageOffen) h += '<div class="frage"><div>' + esc(frageOffen.t) + '</div><button class="kn" id="fja">' + esc(frageOffen.ja) + '</button><button class="kn" id="fnein">Abbrechen</button></div>';
    if (bi.getAttribute("data-sig") === h) return;
    var fokus = document.activeElement === suchFeld;
    bi.setAttribute("data-sig", h);
    bi.innerHTML = h;
    var platz = $("suchplatz");
    if (platz) {
      if (!suchFeld) {
        suchFeld = document.createElement("input");
        suchFeld.className = "feld";
        suchFeld.placeholder = "Symptom suchen …";
        suchFeld.value = b.symQ || "";
        suchFeld.oninput = function () { clearTimeout(suchTimer); var f = this; suchOpen(true); suchTimer = setTimeout(function () { senden("bu:q:" + f.value); }, 250); };
        suchFeld.onfocus = function () { suchOpen(true); };
        suchFeld.onblur = function () { setTimeout(function () { if (document.activeElement !== suchFeld) suchOpen(false); }, 250); };
      }
      platz.parentNode.replaceChild(suchFeld, platz);
      if (fokus) suchFeld.focus();
    } else suchFeld = null;
    var el = bi.querySelectorAll("[data-bu]");
    for (i = 0; i < el.length; i++) {
      el[i].onmousedown = function (ev) { if (this.parentNode.className === "dd") ev.preventDefault(); };
      el[i].onclick = function () { if (this.parentNode.className === "dd") { suchOffen = false; if (suchFeld) suchFeld.blur(); } senden("bu:" + this.getAttribute("data-bu")); };
    }
    el = bi.querySelectorAll("[data-kein]");
    for (i = 0; i < el.length; i++) el[i].onclick = function () { var id = this.getAttribute("data-kein"); frageOffen = { t: this.getAttribute("data-t") + " – so an die Leitstelle melden?", ja: "Melden", f: function () { senden("bu:kein:" + id); } }; buchenZeichnen(); };
    el = bi.querySelectorAll("[data-kh]");
    for (i = 0; i < el.length; i++) el[i].onclick = function () { khWahl = this.getAttribute("data-kh"); buchenZeichnen(); };
    if ($("selbstB")) $("selbstB").onclick = function () { selbstBuchen = true; buchenZeichnen(); };
    if ($("khok")) $("khok").onclick = function () {
      var g = null;
      for (var n = 0; n < b.khs.length; n++) if (b.khs[n].id === khWahl) g = b.khs[n];
      if (!g || b.gebuchtId === g.id) return;
      frageOffen = { t: g.n + " buchen? Der Platz wird belegt – wie in der Leitstelle.", ja: "Buchen", f: function () { senden("bu:kh:" + g.id); } };
      buchenZeichnen();
    };
    if ($("fja")) $("fja").onclick = function () { var f = frageOffen.f; frageOffen = null; f(); buchenZeichnen(); };
    if ($("fnein")) $("fnein").onclick = function () { frageOffen = null; buchenZeichnen(); };
  }
  function suchOpen(an) { suchOffen = an; var el = $("such"); if (el) el.className = "such" + (an ? " offen" : ""); }
  $("buchenK").onclick = function () { if (((stand.neu || {}).tab || {}).buchenDa) blattAuf("buchen"); };

  // ------------------------------------------------------------ Reiter, Navigation
  $("segT").onclick = function () { if (tab !== "transport") $("inh").scrollTop = 0; tab = "transport"; zeichnen(stand); };
  $("segP").onclick = function () { if (((stand.neu || {}).tab || {}).pat || ((stand.neu || {}).tab || {}).ein) { if (tab !== "patient") $("inh").scrollTop = 0; tab = "patient"; zeichnen(stand); } };
  function navOeffnen() {
    navAuf = true;
    zeige($("nav"), true);
    grosseKarte.folgen = true; knopfFolgen();
    var k = ((stand.neu || {}).tab || {}).karte;
    grosseKarte.z = 12;
    grosseKarte.setzen(k);
    $("navT").textContent = k && k.ziel ? "Ziel: " + k.ziel.t : "Navigation";
  }
  $("navZu").onclick = function () { navAuf = false; zeige($("nav"), false); };
  $("zplus").onclick = function () { grosseKarte.zoom(1); };
  $("zminus").onclick = function () { grosseKarte.zoom(-1); };
  $("navFolgen").onclick = function () { grosseKarte.folgen = true; knopfFolgen(); grosseKarte.setzen(((stand.neu || {}).tab || {}).karte); };
  $("navAlle").onclick = function () { var k = ((stand.neu || {}).tab || {}).karte; senden("ka:alle:" + (k && k.alle ? "0" : "1")); };

  // Ziehen zum Scrollen (VR, Controller, Maus) – zusätzlich zum Mausrad
  (function () {
    var box = $("inh"), y0 = 0, s0 = 0, zieht = false, gedrueckt = false;
    box.addEventListener("mousedown", function (ev) { if (ev.target.tagName === "INPUT") return; gedrueckt = true; zieht = false; y0 = ev.clientY; s0 = box.scrollTop; });
    window.addEventListener("mousemove", function (ev) { if (!gedrueckt) return; if (Math.abs(ev.clientY - y0) > 6) zieht = true; if (zieht) box.scrollTop = s0 - (ev.clientY - y0); });
    window.addEventListener("mouseup", function () { gedrueckt = false; setTimeout(function () { zieht = false; }, 0); });
    box.addEventListener("click", function (ev) { if (zieht) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  })();

  // ------------------------------------------------------------ Stand holen
  function holen() {
    var x = new XMLHttpRequest();
    x.open("GET", "/stand?z=" + Date.now());
    x.timeout = 2500;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status !== 200) { $("unter").textContent = "LeitWerk nicht erreichbar"; return; }
      var txt = x.responseText;
      if (txt === letzt) return;
      letzt = txt;
      try { stand = JSON.parse(txt); zeichnen(stand); } catch (e) {}
    };
    try { x.send(); } catch (e) {}
  }

  // Im Tablet der H145: Mission „LeitWerk Leitstelle“ (CARLS-Funkgerät, Briefing, Alarm). Nur die H145 antwortet (leitwerk-app.js).
  if (window.parent && window.parent !== window) {
    window.addEventListener("message", function (ev) {
      var d = ev && ev.data;
      if (!d || d.leitwerk !== "missionStand") return;
      zeige($("tabv"), true);
      $("tabvT").textContent = d.laeuft ? "Funkgerät & Tablet verbunden" : "Funkgerät & Tablet nicht verbunden";
      $("tabvU").textContent = d.laeuft ? "" : d.andere ? "andere Mission läuft" : "";
      $("tabvB").textContent = d.laeuft ? "Neu verbinden" : "Verbinden";
      zeichnen(stand);
    });
    $("tabvB").onclick = function () { try { window.parent.postMessage({ leitwerk: "mission" }, "*"); } catch (e) {} };
    var fragen = function () { try { window.parent.postMessage({ leitwerk: "stand" }, "*"); } catch (e) {} };
    fragen();
    setInterval(fragen, 3000);
  }
  window.onresize = function () { zeichnen(stand); };
  holen();
  setInterval(holen, 1000);
})();
</script>
</body>
</html>
