<script>
(function () {
  var stand = {};
  var online = false;
  var letzt = "";
  var KACHEL = "https://mapsneu.wien.gv.at/basemap/geolandbasemap/normal/google3857/";
  // Ansicht (nur hier): Reiter, offener Einsatz, Buchen-Schritt, gewählter Status
  var A = { tab: "einsaetze", sel: "", buchen: false, bs: "art", khWahl: "", wahl: "", gesendet: "", abf: {}, anim: "" };
  var letzteAkt = "";
  var tabv = null; // H145: { laeuft, andere }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function zeige(el, an) { if (an) el.className = el.className.replace(/ ?versteckt/g, ""); else if (!/versteckt/.test(el.className)) el.className += " versteckt"; }
  function prefSetzen(k, v) { PREF[k] = v; try { localStorage.setItem("lw-efb", JSON.stringify(PREF)); } catch (e) {} }
  function finde(l, f) { for (var i = 0; i < (l || []).length; i++) if (f(l[i])) return l[i]; return null; }
  function alle(sel, f) { var l = $("seite").querySelectorAll(sel); for (var i = 0; i < l.length; i++) f(l[i]); }
  function senden(cmd) {
    var x = new XMLHttpRequest();
    x.open("POST", "/befehl");
    x.onreadystatechange = function () { if (x.readyState === 4) setTimeout(holen, 200); };
    try { x.send(cmd); } catch (e) {}
  }
  var toastT = 0;
  function toast(t) { var b = $("toast"); b.firstChild.textContent = t; zeige(b, true); clearTimeout(toastT); toastT = setTimeout(function () { zeige(b, false); }, 2400); }

  // ------------------------------------------------------------ Code-Marke (Kopie von src/ui/fenster/pilot/marke.js)
  var C = { rot: "#d32f2f", orange: "#f57c00", gelb: "#fbc02d", "grün": "#2e9d4a" };
  var HELL = { rot: "#f2a7a7", orange: "#ffcc99", gelb: "#fde68a", "grün": "#a9dcb6" };
  var TXT = { rot: "#ffffff", orange: "#15181c", gelb: "#15181c", "grün": "#ffffff" };
  var WEISS = "background:#ffffff;color:#15181c;padding:1px 7px;";
  function marke(stufe) {
    var s = String(stufe || ""), f = null;
    for (var k in C) if (!f && s.indexOf(k) >= 0) f = k;
    if (/^ALS/.test(s) && f) return { a: "background:" + C[f] + ";padding:4px 10px;", i: "color:" + TXT[f] + ";" };
    if (/^BLS\/ALS/.test(s)) return { a: "background:repeating-linear-gradient(135deg,#7d64cc 0 5px,#d9d0f7 5px 9px);padding:3px;", i: "background:#7d64cc;color:#ffffff;padding:1px 7px;" };
    if (/^BLS/.test(s) && f) return { a: "background:repeating-linear-gradient(135deg," + C[f] + " 0 5px," + HELL[f] + " 5px 9px);padding:3px;", i: WEISS };
    if (/^Sekundär.*sofort/.test(s)) return { a: "border:2px solid #b4232a;background:repeating-linear-gradient(90deg,#fde3e3 0 6px,#ffffff 6px 12px);padding:2px 8px;", i: "color:#8f1b21;" };
    if (/^Sekundär/.test(s)) return { a: "border:2px solid #2f6fb5;background:#e8f0fa;padding:2px 8px;", i: "color:#1f4f8a;" };
    if (/^Akut/.test(s)) return { a: "background:radial-gradient(#3a9c8f 1.7px,#cdebe7 2px) 0 0/6px 6px;padding:3px;", i: WEISS };
    if (/^Telemed/.test(s)) return { a: "border:2px dashed #2563eb;background:#eef3fe;padding:2px 8px;", i: "color:#1d4ed8;" };
    if (/^Weitergabe/.test(s)) return { a: "border:2px dotted #6b7280;background:#f3f5f8;padding:2px 8px;", i: "color:#374151;" };
    if (/^Gro(ß|ss)/.test(s)) return { a: "background:repeating-linear-gradient(45deg,#475569 0 6px,#fbc02d 6px 12px);padding:3px;", i: WEISS };
    if (/^Alpin/.test(s)) return { a: "background:linear-gradient(135deg,#8d6e63 0 60%,#5d4037 60%);padding:4px 10px;", i: "color:#ffffff;" };
    return { a: "background:#6b7280;padding:4px 10px;", i: "color:#ffffff;" };
  }
  function mk(code, stufe, gross) { var m = marke(stufe); return '<span class="mk" style="' + m.a + (gross ? "font-size:15px;" : "") + '"><span style="' + m.i + '">' + esc(code) + "</span></span>"; }

  // ------------------------------------------------------------ Karte (Kacheln von basemap.at, Norden oben)
  function Karte(box, klein) {
    this.box = box; this.klein = klein; this.z = 12; this.lat = 48.4; this.lon = 15.6; this.folgen = true; this.imgs = {};
    box.innerHTML = '<div class="kach"></div><div class="mkn"></div>' + (klein ? '<div class="info"></div><div class="gross">Navigation ›</div>' : '<div class="info versteckt"></div>') + '<div class="quelle">Datenquelle: basemap.at</div>';
    this.kach = box.childNodes[0]; this.mk = box.childNodes[1]; this.info = box.childNodes[2];
    var k = this;
    if (!klein) {
      var zieh = null;
      box.onmousedown = function (ev) { zieh = { x: ev.clientX, y: ev.clientY, px: k.px(k.lat, k.lon) }; k.folgen = false; knopfFolgen(); };
      box.onmousemove = function (ev) {
        if (!zieh) return;
        var nx = zieh.px.x - (ev.clientX - zieh.x), ny = zieh.px.y - (ev.clientY - zieh.y);
        var ll = k.ll(nx, ny); k.lat = ll.lat; k.lon = ll.lon; k.zeichnen();
      };
      box.onmouseup = box.onmouseleave = function () { zieh = null; };
      box.onwheel = function (ev) { k.zoom(ev.deltaY < 0 ? 1 : -1); ev.preventDefault(); };
    }
  }
  Karte.prototype.px = function (lat, lon) {
    var n = 256 * Math.pow(2, this.z);
    var s = Math.sin(lat * Math.PI / 180);
    return { x: (lon + 180) / 360 * n, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n };
  };
  Karte.prototype.ll = function (x, y) {
    var n = 256 * Math.pow(2, this.z);
    var lon = x / n * 360 - 180;
    var m = Math.PI - 2 * Math.PI * y / n;
    return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(m) - Math.exp(-m))), lon: lon };
  };
  Karte.prototype.zoom = function (d) { this.z = Math.max(7, Math.min(18, this.z + d)); this.zeichnen(); };
  Karte.prototype.passend = function (a, b) {
    var w = this.box.clientWidth || 500, h = this.box.clientHeight || 170;
    this.lat = (a.lat + b.lat) / 2; this.lon = (a.lon + b.lon) / 2;
    for (var z = 16; z >= 7; z--) {
      this.z = z;
      var p = this.px(a.lat, a.lon), q = this.px(b.lat, b.lon);
      if (Math.abs(p.x - q.x) < w - 70 && Math.abs(p.y - q.y) < h - 60) break;
    }
  };
  Karte.prototype.zeichnen = function () {
    var w = this.box.clientWidth, h = this.box.clientHeight;
    if (!w || !h) return;
    var c = this.px(this.lat, this.lon);
    var x0 = c.x - w / 2, y0 = c.y - h / 2;
    var n = Math.pow(2, this.z);
    var neu = {};
    for (var tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + w) / 256); tx++) {
      for (var ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + h) / 256); ty++) {
        if (ty < 0 || ty >= n) continue;
        var key = this.z + "/" + ty + "/" + ((tx % n) + n) % n;
        var img = this.imgs[key];
        if (!img) { img = document.createElement("img"); img.src = KACHEL + key + ".png"; img.alt = ""; this.kach.appendChild(img); }
        img.style.left = Math.round(tx * 256 - x0) + "px"; img.style.top = Math.round(ty * 256 - y0) + "px";
        neu[key] = img;
      }
    }
    for (var k in this.imgs) if (!neu[k]) this.kach.removeChild(this.imgs[k]);
    this.imgs = neu;
    this.x0 = x0; this.y0 = y0;
    this.marken();
  };
  Karte.prototype.pos = function (lat, lon) { var p = this.px(lat, lon); return { x: Math.round(p.x - this.x0), y: Math.round(p.y - this.y0) }; };
  Karte.prototype.marken = function () {
    var d = this.daten;
    if (!d || !d.ich) { this.mk.innerHTML = ""; return; }
    var h = "", i, p;
    var ich = this.pos(d.ich.lat, d.ich.lon);
    if (d.ziel) {
      var z = this.pos(d.ziel.lat, d.ziel.lon);
      var dx = z.x - ich.x, dy = z.y - ich.y, len = Math.sqrt(dx * dx + dy * dy), w = Math.atan2(dy, dx) * 180 / Math.PI;
      h += '<div class="m-linie" style="left:' + ich.x + "px;top:" + ich.y + "px;width:" + Math.round(len) + "px;-webkit-transform:rotate(" + w + "deg);transform:rotate(" + w + 'deg)"></div>';
    }
    var fz = d.fz || [];
    var label = this.z >= 11 || this.klein;
    for (i = 0; i < fz.length; i++) {
      p = this.pos(fz[i].lat, fz[i].lon);
