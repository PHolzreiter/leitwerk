<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1323">
<title>LeitWerk Pilot</title>
<style>
  :root { --bg:#0b1323; --karte:#131d33; --rand:rgba(150,185,235,.16); --text:#e9f0fb; --dim:#9db0c9; --akzent:#2f7cf6; --warn:#f5a524; --rot:#e53935; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { padding:12px 12px calc(12px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  header b { font-size:20px; }
  header small { color:var(--dim); display:block; font-size:12px; }
  .pill { margin-left:auto; font-size:12px; padding:4px 9px; border-radius:99px; background:rgba(34,197,94,.15); color:#4ade80; }
  .pill.aus { background:rgba(245,165,36,.15); color:var(--warn); }
  .jetzt { border-radius:14px; padding:12px 14px; background:var(--karte); border:1px solid var(--rand); border-left:8px solid var(--f,#666); margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .jetzt .n { font-size:34px; font-weight:800; min-width:34px; text-align:center; }
  .jetzt .t { font-size:17px; font-weight:600; }
  .alarm { background:var(--rot); color:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px; animation:blink 1s infinite alternate; }
  .alarm b { display:block; font-size:18px; }
  @keyframes blink { to { filter:brightness(1.25); } }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .st { border:none; border-radius:14px; padding:16px 10px; min-height:84px; background:var(--karte); color:var(--text); border:1px solid var(--rand); border-bottom:6px solid var(--f,#666); font-size:15px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .st .n { font-size:30px; font-weight:800; line-height:1; }
  .st.aktiv { background:var(--f); color:#fff; }
  .st:active { transform:scale(.97); }
  .flug { width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:600; background:var(--akzent); color:#fff; margin-bottom:10px; }
  .karte { background:var(--karte); border:1px solid var(--rand); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:15px; line-height:1.4; }
  .karte h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .dim { color:var(--dim); font-size:13px; }
  .fehler { color:var(--warn); }
</style>
</head>
<body>
<header><div><b id="heli">LeitWerk Pilot</b><small id="unter">verbinde …</small></div><span class="pill aus" id="verb">offline</span></header>
<div id="alarm" class="alarm" hidden></div>
<div class="jetzt" id="jetzt"><span class="n">–</span><span class="t">kein Hubschrauber</span></div>
<div class="grid" id="grid"></div>
<button class="flug" id="flug" hidden>Übungsflug</button>
<div class="karte" id="einsatz" hidden></div>
<div class="karte" id="patient" hidden></div>
<p class="dim">Tipp: Seite zum Startbildschirm hinzufügen und in den Handy-Einstellungen die automatische Bildschirmsperre verlängern, solange du fliegst.</p>
<script>
const t = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
let letzt = "";
async function senden(cmd) {
  try {
    if (navigator.vibrate) navigator.vibrate(30);
    await fetch(`/befehl?t=${encodeURIComponent(t)}`, { method: "POST", body: cmd });
    setTimeout(holen, 250);
  } catch (e) { $("verb").textContent = "offline"; $("verb").className = "pill aus"; }
}
function zeichnen(s) {
  const k = JSON.stringify(s);
  if (k === letzt) return;
  letzt = k;
  $("heli").textContent = s.heli || "LeitWerk Pilot";
  $("unter").textContent = s.unter || "";
  const j = $("jetzt");
  j.style.setProperty("--f", s.status?.farbe || "#666");
  j.innerHTML = s.status ? `<span class="n">${esc(s.status.nummer)}</span><span class="t">${esc(s.status.name)}</span>` : `<span class="n">–</span><span class="t">${esc(s.hinweis || "kein Hubschrauber")}</span>`;
  const a = $("alarm");
  a.hidden = !s.alarm;
  if (s.alarm) a.innerHTML = `<b>ALARM</b>${esc(s.alarm)}<div>Status 2 = übernommen</div>`;
  const g = $("grid");
  g.innerHTML = "";
  for (const b of s.knoepfe || []) {
    const el = document.createElement("button");
    el.className = "st" + (b.aktiv ? " aktiv" : "");
    el.style.setProperty("--f", b.farbe);
    el.innerHTML = `<span class="n">${esc(b.nummer)}</span><span>${esc(b.name)}</span>`;
    el.onclick = () => senden(b.aktion);
    g.appendChild(el);
  }
  const f = $("flug");
  f.hidden = !s.flug;
  if (s.flug) { f.textContent = s.flug; f.onclick = () => senden("fliegen"); }
  const e = $("einsatz");
  e.hidden = !s.einsatz;
  if (s.einsatz) e.innerHTML = `<h3>Einsatz ${esc(s.einsatz.nummer)}</h3><b>${esc(s.einsatz.stichwort)}</b><div>${esc(s.einsatz.adresse)}</div>${s.einsatz.info ? `<div class="dim">${esc(s.einsatz.info)}</div>` : ""}${s.einsatz.ziel ? `<div>Ziel: <b>${esc(s.einsatz.ziel)}</b></div>` : ""}`;
  const p = $("patient");
  p.hidden = !s.patient;
  if (s.patient) p.innerHTML = `<h3>Patient</h3>${s.patient.map((x) => `<div>${esc(x)}</div>`).join("")}`;
}
async function holen() {
  try {
    const r = await fetch(`/stand?t=${encodeURIComponent(t)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    zeichnen(await r.json());
    $("verb").textContent = "verbunden"; $("verb").className = "pill";
  } catch (e) {
    $("verb").textContent = "offline"; $("verb").className = "pill aus";
  }
}
holen();
setInterval(holen, 1000);
try { navigator.wakeLock?.request("screen"); } catch {}
</script>
</body>
</html>
