<!doctype html>
<html lang="de">

<title>LeitWerk Pilot</title>
<!--

<style>

  .hy-zug { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--flaeche-2); font-size:13.5px; }

</head>
<body>
<header class="hy-kopf"><div class="hy-h"><b id="heli">LeitWerk Pilot</b><small id="unter">verbinde …</small></div><span class="hy-verb aus" id="verb"><i></i>offline</span></header>
<div class="hy-alarm" id="alarm" role="alert" hidden></div>
<nav class="hy-tabs" id="tabs"><button class="hy-tab on" data-s="0">Funk</button><button class="hy-tab" data-s="1">Einsatz</button><button class="hy-tab" data-s="2">Buchen</button></nav>
<main id="seiten">
  <section class="seite" id="s-funk">
    <div class="hy-lcd" id="lcd"><div class="z1"><span><span class="bal"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:13px"></i></span>TETRA · BOS</span><span id="uhr"></span></div><div class="gr" id="lcd-gr"></div><div class="hy-st"><b id="lcd-n">–</b><span id="lcd-t"></span></div><i class="fort"></i></div>
    <div class="hy-keys" id="tasten"></div>
    <p class="hy-hint">Statustaste ca. 2 Sekunden halten, bis „düt-düt-düt“ kommt.</p>
    <button class="hy-ptt" id="ptt" hidden><b>SPRECHEN</b><small id="ptt-t">gedrückt halten – „LEO von …“</small></button>
    <div class="hy-kanal" id="kanal"><i></i><span></span></div>
    <div class="hy-grp" id="grp"><button data-gr="-1" aria-label="Sprechgruppe zurück">‹</button><span class="hy-gn"><span id="grp-n"></span><small id="grp-t">Sprechgruppe</small></span><button data-gr="1" aria-label="Sprechgruppe weiter">›</button></div>
    <button class="hy-flug" id="flug" hidden></button>
  </section>
  <section class="seite" id="s-einsatz"><div id="einsatz"></div></section>
  <section class="seite" id="s-buchen"><div id="buchen"></div></section>
</main>
<div class="hy-schleier" id="schleier" hidden></div>
<div class="hy-blatt" id="blatt" hidden><b style="font-size:17px" id="blatt-titel"></b><span style="font-size:14px;color:var(--text-2)" id="blatt-text"></span><div class="hy-bk"><button id="blatt-nein">Abbrechen</button><button class="ja" id="blatt-ja">Buchen</button></div></div>
<script>
const t = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const sig = {};
const geaendert = (k, wert) => { const j = JSON.stringify(wert); if (sig[k] === j) return false; sig[k] = j; return true; };
const IC = {
  ort: '<svg class="ic s" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>',
  flug: '<svg class="ic s" viewBox="0 0 24 24"><path d="M2 5h18M11 5v3M5 12a4 4 0 0 1 4-4h5a4 4 0 0 1 0 8H9a4 4 0 0 1-4-4z"></path></svg>',
  pfeil: '<svg class="ic s" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>',
  haken: '<svg class="ic s" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>',
};
let stand = {};

async function senden(cmd) {
  try {
    await fetch(`/befehl?t=${encodeURIComponent(t)}`, { method: "POST", body: cmd });
    setTimeout(holen, 250);
  } catch (e) { verbindung(false); }
}
const vib = (m) => { try { navigator.vibrate && navigator.vibrate(m); } catch {} };
function verbindung(an) { const v = $("verb"); v.className = "hy-verb" + (an ? "" : " aus"); v.innerHTML = `<i></i>${an ? "verbunden" : "offline"}`; }

// ---------------- Töne (wie am Funkgerät)
let ac = null;
function ton(folge) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    let z = ac.currentTime + 0.01;
    for (const [hz, d] of folge) {
      if (hz) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = hz;
        g.gain.setValueAtTime(0, z); g.gain.linearRampToValueAtTime(0.15, z + 0.004); g.gain.setValueAtTime(0.15, z + d - 0.004); g.gain.linearRampToValueAtTime(0, z + d);
        o.connect(g).connect(ac.destination); o.start(z); o.stop(z + d + 0.02);
      }
      z += d;
    }
  } catch {}
}
const tonDruck = () => ton([[1200, 0.07]]);
const tonGesendet = () => ton([[1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055]]);

// ---------------- Seiten (Reiter mit gleitender Markierung, auch zum Wischen)
const seiten = $("seiten");
let seite = 0;
function zeigeSeite(i, sanft = true) { seiten.scrollTo({ left: i * seiten.clientWidth, behavior: sanft ? "smooth" : "auto" }); }
seiten.addEventListener("scroll", () => {
  const w = Math.max(1, seiten.clientWidth);
  const x = seiten.scrollLeft / w;
  $("tabs").style.setProperty("--i", x.toFixed(3));
  const i = Math.round(x);
  if (i !== seite) {
    seite = i;
    document.querySelectorAll("#tabs .hy-tab").forEach((b) => b.classList.toggle("on", Number(b.dataset.s) === i));
  }
}, { passive: true });
document.querySelectorAll("#tabs .hy-tab").forEach((b) => b.addEventListener("click", () => zeigeSeite(Number(b.dataset.s))));
window.addEventListener("resize", () => zeigeSeite(seite, false));

// ---------------- Funk: Display und Statustasten (gedrückt halten, ca. 2 s)
let halt = null;
function tastenBauen(keys, alarmJetzt) {
  const box = $("tasten");
  box.innerHTML = "";
  const reihe = [...keys.filter((k) => k.n !== "9"), ...keys.filter((k) => k.n === "9")];
  for (const k of reihe) {
    const b = document.createElement("button");
    b.className = "hy-key" + (k.n === "9" ? " breit" : "") + (k.aktiv ? " aktiv" : "") + (alarmJetzt && k.n === "9" ? " naechst" : "") + (k.aus ? " aus" : "");
    b.style.background = k.f;
    b.innerHTML = `<b>${esc(k.n)}</b><span>${esc(k.n === "9" ? "Quittieren" : k.kurz)}</span>`;
    const los = () => {
      if (!halt || halt.b !== b) return;
      clearTimeout(halt.timer);
      b.classList.remove("halten");
      $("lcd").classList.remove("halten");
      halt = null;
    };
    b.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      b.setPointerCapture?.(ev.pointerId);
      if (halt) los();
      tonDruck(); vib(25);
      b.classList.add("halten");
      $("lcd").classList.add("halten");
      const timer = setTimeout(() => {
        b.classList.remove("halten");
        $("lcd").classList.remove("halten");
        halt = null;
        tonGesendet(); vib([60, 40, 60, 40, 60, 40, 60]);
        senden(k.aktion);
      }, 2000);
      halt = { b, timer };
    });
    b.addEventListener("pointerup", los);
    b.addEventListener("pointercancel", los);
    b.addEventListener("contextmenu", (ev) => ev.preventDefault());
    box.appendChild(b);
  }
}
// alte Daten (ohne „neu“): Tasten aus „knoepfe“
function tastenAlt(s) {
  return (s.knoepfe || []).map((k) => ({ n: k.nummer, kurz: k.name, f: "#CDEFA0", aktiv: k.aktiv, aktion: k.aktion }));
}

// Sprechtaste (gedrückt halten)
(() => {
  const b = $("ptt");
  let unten = false;
  let lebt = null;
  // solange gedrückt: jede Sekunde ein Lebenszeichen – reißt die Verbindung ab, beendet LeitWerk die Sendung selbst
  const an = (ev) => { ev.preventDefault(); if (unten) return; unten = true; b.classList.add("an"); b.querySelector("b").textContent = "DU SPRICHST"; vib(20); b.setPointerCapture?.(ev.pointerId); senden("funk_an"); lebt = setInterval(() => senden("funk_halt"), 1000); };
  const aus = () => { if (!unten) return; unten = false; clearInterval(lebt); lebt = null; b.classList.remove("an"); b.querySelector("b").textContent = "SPRECHEN"; senden("funk_aus"); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) aus(); });
  b.addEventListener("pointerdown", an);
  b.addEventListener("pointerup", aus);
  b.addEventListener("pointercancel", aus);
  b.addEventListener("contextmenu", (ev) => ev.preventDefault());
})();
document.querySelectorAll("#grp [data-gr]").forEach((b) => b.addEventListener("click", () => { vib(15); senden("gr:" + b.dataset.gr); }));

// ---------------- Einsatz
let abfAuf = false;
function einsatzZeichnen(s) {
  const n = s.neu || {};
  const e = n.ein;
  const box = $("einsatz");
  if (!e) { box.innerHTML = `<div class="hy-leer">Kein Einsatz.<br>Warte auf die Alarmierung durch die Leitstelle.</div>`; return; }
  const abf = s.einsatz2?.abfrage || [];
  const k = (n.nav || [])[0];
  const st = n.st || {};
  let h = `<div class="hy-k">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${e.stufe ? `<span class="stufe" style="background:${esc(e.sf)}">${esc(e.stufe)}</span>` : ""}<b style="font-size:13px">${esc(e.code)}</b><span style="margin-left:auto;font-size:12px;color:var(--dim)">${esc(e.nr)}</span></div>
    <div class="hy-sw">${esc(e.sw)}</div>
    ${e.zi ? `<div class="hy-zi"><small>Info der Leitstelle</small>${e.ziB ? `<b>${esc(e.ziB)}</b>` : ""}${esc(e.ziS)}${esc(e.ziT)}</div>` : ""}
    ${e.gsText ? `<div class="hy-gsh">${esc(e.gsText)}</div>` : ""}
    <div class="hy-z">${IC.ort}<div>${esc(e.adr)}${e.zusatz ? `<small>${esc(e.zusatz)}</small>` : ""}</div></div>
    ${n.fl ? `<div class="hy-z">${IC.flug}<div>${esc(n.fl.km)}<small>${esc(n.fl.t)}</small></div></div>` : ""}
    ${(n.nav || []).map((x, i) => `<button class="hy-koord" data-kc="${esc(x.kc)}">${esc(x.k)}<small>${esc(x.t)} · tippen zum Kopieren</small></button>`).join("")}
    ${abf.length ? `<button class="hy-abf${abfAuf ? " auf" : ""}" id="abf">${IC.pfeil}Notrufabfrage · ${abf.length} Angaben</button><div class="hy-abfl" id="abfl"${abfAuf ? "" : " hidden"}>${abf.map((z, d) => `<div style="--d:${d}">${esc(z)}</div>`).join("")}</div>` : ""}
    <div class="hy-chips">${(n.fzs || []).map((f) => `<span class="hy-fz" style="background:${esc(f.f)}"><b>${esc(f.s)}</b>${esc(f.t)}</span>`).join("")}</div>
  </div>`;
  const g = n.gs;
  if (g && g.br) {
    h += `<div class="hy-k"><span class="hy-lbl">Bereitstellungsraum · ${esc(g.gruppe)}</span>
      ${g.abruf ? `<div class="hy-abruf" role="alert"><b>ABRUF</b><span>${esc(g.abruf.t)}</span>${g.abruf.pct ? `<div class="hy-fuss"><i style="--w:${esc(g.abruf.pct)}%"></i></div>` : ""}</div>` : ""}
      ${g.zug ? `<div class="hy-zug"><b style="background:${esc(g.zug.f)}">${esc(g.zug.p)}</b><span>${esc(g.zug.t)}</span></div>` : ""}
      ${g.zahlen ? `<div class="hy-gsz">${g.zahlen.map((z) => `<span><i style="background:${esc(z.f)}"></i><b>${esc(z.n)}</b> ${esc(z.t)}</span>`).join("")}</div>` : ""}
      ${g.det ? `<div class="hy-werte">${(g.werte || []).map((w) => `<div><span>${esc(w.l)}</span>${esc(w.v)}</div>`).join("")}</div>` : ""}
      ${g.det && g.liste ? `<div class="hy-brl">${g.liste.map((r) => `<div class="${esc((r.c || ""))}"><i>${esc(r.nr)}</i><span>${esc(r.t)}</span><small>${esc(r.z)}</small></div>`).join("")}</div>` : ""}
    </div>`;
  }
  h += `<div class="hy-k"><span class="hy-lbl">Patient</span>${
    n.pats && n.pats.length
      ? n.pats.map((p) => `<div class="hy-pat"><span class="hy-sicht" style="background:${esc(p.sf)};color:${esc(p.sc)}">${esc(p.s)}</span><div><b>${esc(p.t)}</b>${p.l ? `<div style="font-size:13px;color:var(--text-2);margin-top:2px">${esc(p.l)}</div>` : ""}<div class="hy-vit">${(p.v || []).map((v) => `<span class="${esc(v.c)}">${esc(v.t)}</span>`).join("")}</div></div></div>`).join("")
      : `<span class="hy-hinw">${esc(n.patZu || "Was der Patient hat, siehst du am Einsatzort (Status 3).")}</span>`
  }</div>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-kc]").forEach((b) => b.addEventListener("click", () => { navigator.clipboard?.writeText(b.dataset.kc).then(() => vib(20)); }));
  $("abf")?.addEventListener("click", () => { abfAuf = !abfAuf; $("abf").classList.toggle("auf", abfAuf); $("abfl").hidden = !abfAuf; });
}

// ---------------- Buchen (Entscheidung und Krankenhaus in vier Schritten wie in der Einsatzmaske)
let suchFeld = null;
let suchTimer = 0;
let khWahl = "";
let khFuer = "";
function buchenZeichnen(s) {
  const n = s.neu || {};
  const b = n.ent;
  const box = $("buchen");
  const fokus = document.activeElement === suchFeld;
  const plan = n.planT ? `<div class="hy-plan">${IC.haken}<span>${esc(n.planT)}</span></div>` : "";
  if (!b) { box.innerHTML = `${plan}<div class="hy-leer">${esc(n.amOrtText || (n.ein ? "Buchen geht am Einsatzort (Status 3)." : "Kein Einsatz – nichts zu buchen."))}</div>`; suchFeld = null; return; }
  if (khFuer !== b.fuer) { khFuer = b.fuer; khWahl = ""; }
  if (!b.khs.some((h) => h.id === khWahl)) khWahl = b.gebuchtId && b.khs.some((h) => h.id === b.gebuchtId) ? b.gebuchtId : (b.khs[0]?.id || "");
  let h = `<span class="hy-lbl">Was passiert mit dem Patienten?</span>
    <div class="hy-wahl">${b.wahl.map((w) => `<button class="${w.on ? "on" : ""}" data-seite="${esc(w.id)}"><b>${esc(w.t)}</b><small>${esc(w.d)}</small></button>`).join("")}</div>`;
  if (b.keinWahl) h += `<div class="hy-w3">${b.keinWahl.map((w) => `<button class="${w.on ? "on" : ""}" data-kein="${esc(w.id)}" data-t="${esc(w.t)}">${esc(w.t)}<small>${esc(w.s)}</small></button>`).join("")}</div>`;
  if (b.rtwFehlt) h += `<div class="hy-hinw">Noch kein RTW im Einsatz – bitte bei der Leitstelle anfordern.</div>`;
  if (b.buchen) {
    h += `<span class="hy-lbl" style="margin-top:6px">Krankenhaus${b.gebuchtId ? ` · <span class="pill ok">gebucht ${esc(b.gebuchtT)}</span>` : ""}</span><div class="hy-schritte">`;
    for (const k of b.schritte) {
      if (k.fertig) h += `<div class="hy-fertig"><span class="n">✓</span><span class="w"><span class="l">${esc(k.titel)}</span>${esc(k.wert)}</span><button class="kn leise" data-schritt="${esc(k.nr)}">Ändern</button></div>`;
      else if (k.offen) h += `<div class="hy-offen"><span class="n">${esc(k.nr)}</span>${esc(k.titel)}</div>`;
      else {
        h += `<div class="hy-aktiv"><div class="hy-skopf"><span class="n">${esc(k.nr)}</span>${esc(k.frage)}</div>`;
        if (k.istAlter) h += `<div class="hy-w3">${b.altW.map((w) => `<button class="${w.on ? "on" : ""}" data-alter="${esc(w.id)}">${esc(w.t)}<small>${esc(w.s)}</small></button>`).join("")}</div>`;
        if (k.istDringlich) h += `<div class="hy-w3">${b.drW.map((w) => `<button class="${(w.on ? "on" : "") + (w.aus ? " aus" : "")}" data-dring="${esc(w.id)}">${esc(w.t)}<small>${esc(w.s)}</small></button>`).join("")}</div>`;
        if (k.istSymptom) h += `<div id="suchplatz"></div>${b.symHinweis ? `<div class="hy-hinw" style="font-size:12px;color:var(--dim)">${esc(b.symHinweis)}</div>` : ""}<div class="hy-chips">${b.symW.map((w) => `<button class="kn" data-sym="${esc(w.id)}">${esc(w.t)}</button>`).join("")}</div>`;
        if (k.istVorschlag) {
          if (b.khLeer) h += `<div class="hy-hinw">${esc(b.khLeer)}</div>`;
          h += b.khs.map((x) => `<div class="hy-kh${x.id === khWahl ? " gew" : ""}" data-kh="${esc(x.id)}"><span class="hy-radio${x.id === khWahl ? " an" : ""}"></span><div style="min-width:0"><b>${esc(x.n)}</b> <span class="zeit">· ${esc(x.km)}${esc(x.min)}</span><div class="hy-merk">${(x.merk || []).map((m) => `<span class="${esc(m.c)}">${esc(m.t)}</span>`).join("")}</div></div>${x.frei ? `<span class="${esc(x.freiCls)}">${esc(x.frei)}</span>` : "<span></span>"}</div>`).join("");
          const gew = b.khs.find((x) => x.id === khWahl);
          if (gew) h += `<button class="hy-buchen" id="buchen-ok">${esc(gew.n)} ${b.gebuchtId === gew.id ? "gebucht" : "buchen"}</button>`;
        }
        h += `</div>`;
      }
    }
    h += `</div>`;
  }
  h += plan;
  box.innerHTML = h;
  // Suchfeld bleibt dasselbe (Tastatur bleibt offen)
  const platz = box.querySelector("#suchplatz");
  if (platz) {
    if (!suchFeld) {
      suchFeld = document.createElement("input");
      suchFeld.className = "feld";
      suchFeld.placeholder = "Symptom suchen …";
      suchFeld.enterKeyHint = "search";
      suchFeld.setAttribute("aria-label", "Symptom suchen");
      suchFeld.addEventListener("input", () => { clearTimeout(suchTimer); suchTimer = setTimeout(() => senden("bu:q:" + suchFeld.value), 250); });
      suchFeld.value = b.symQ || "";
    }
    platz.replaceWith(suchFeld);
    if (fokus) suchFeld.focus();
  } else suchFeld = null;
  box.querySelectorAll("[data-seite]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:seite:" + x.dataset.seite); }));
  box.querySelectorAll("[data-kein]").forEach((x) => x.addEventListener("click", () => fragen(x.dataset.t, "Kein Transport – so an die Leitstelle melden?", "Melden", () => senden("bu:kein:" + x.dataset.kein))));
  box.querySelectorAll("[data-schritt]").forEach((x) => x.addEventListener("click", () => { vib(10); senden("bu:schritt:" + x.dataset.schritt); }));
  box.querySelectorAll("[data-sym]").forEach((x) => x.addEventListener("click", () => { vib(15); suchFeld?.blur(); senden("bu:sym:" + x.dataset.sym); }));
  box.querySelectorAll("[data-alter]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:alter:" + x.dataset.alter); }));
  box.querySelectorAll("[data-dring]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:dring:" + x.dataset.dring); }));
  box.querySelectorAll("[data-kh]").forEach((x) => x.addEventListener("click", () => { vib(10); khWahl = x.dataset.kh; sig.buchen = ""; buchenZeichnen(stand); }));
  $("buchen-ok")?.addEventListener("click", () => {
    const gew = b.khs.find((x) => x.id === khWahl);
    if (!gew || b.gebuchtId === gew.id) return;
    fragen(`${gew.n} buchen?`, "Der Platz wird belegt – wie in der Leitstelle. Ändern geht, solange ihr am Einsatzort seid.", "Buchen", () => senden("bu:kh:" + gew.id));
  });
}
function fragen(titel, text, ja, f) {
  $("blatt-titel").textContent = titel;
  $("blatt-text").textContent = text;
  $("blatt-ja").textContent = ja;
  $("blatt").hidden = false;
  $("schleier").hidden = false;
  const zu = () => { $("blatt").hidden = true; $("schleier").hidden = true; };
  $("blatt-ja").onclick = () => { zu(); vib(30); f(); };
  $("blatt-nein").onclick = zu;
  $("schleier").onclick = zu;
}

// ---------------- Alarm: Band oben, auf „Funk“ (9 pulsiert), vibrieren bis quittiert (höchstens 1 Minute)
let alarmVorher = "";
let vibTimer = 0;
function alarmZeichnen(s) {
  const n = s.neu || {};
  const a = n.alarm;
  const box = $("alarm");
  if (geaendert("alarmband", a || null)) {
    box.hidden = !a;
    if (a) box.innerHTML = `<b>ALARM</b><span>${esc(a.t)}${a.ziB || a.ziT ? `<br>${a.ziB ? `<b>${esc(a.ziB)}</b>` : ""}${a.ziB && a.ziT ? " // " : ""}${esc(a.ziT)}` : ""}<br>${esc(a.s)}</span><small>9 = quittieren · 2 = abheben · Handy vibriert bis dahin</small>`;
  }
  const k = a ? a.t + a.s : (s.alarm ? (s.alarmCode || "") + s.alarm : "");
  if (k && k !== alarmVorher) {
    zeigeSeite(0);
    const start = Date.now();
    clearInterval(vibTimer);
    vib([500, 200, 500, 200, 500]);
    vibTimer = setInterval(() => {
      if (!(stand.neu?.alarm || stand.alarm) || Date.now() - start > 60000) { clearInterval(vibTimer); vib(0); return; }
      vib([500, 200, 500, 200, 500]);
    }, 2600);
  }
  if (!k) clearInterval(vibTimer);
  alarmVorher = k;
  // Punkt am Reiter „Einsatz“ bei Alarm und Abruf
  const tb = document.querySelector('#tabs [data-s="1"]');
  const pkt = !!k || !!n.abrufPunkt;
  if (geaendert("punkt", pkt)) tb.innerHTML = "Einsatz" + (pkt ? '<i class="hy-pkt"></i>' : "");
}

function zeichnen(s) {
  stand = s;
  const n = s.neu || {};
  if (geaendert("kopf", [s.heli, s.unter])) { $("heli").textContent = s.heli || "LeitWerk Pilot"; $("unter").textContent = s.unter || s.hinweis || ""; }
  // Display
  const st = n.st || (s.status ? { n: s.status.nummer, t: s.status.name } : null);

  const keys = n.keys || tastenAlt(s);
  if (!halt && geaendert("tasten", [keys.map((k) => [k.n, k.aktiv, k.aus, k.f]), !!n.alarm])) tastenBauen(keys, !!n.alarm);

  const ptt = $("ptt");
  ptt.hidden = !(s.funk?.knoepfe || []).length;

  const f = $("flug");
  f.hidden = !s.flug;
  if (s.flug) { f.textContent = s.flug; f.onclick = () => { vib(20); senden("fliegen"); }; }
  if (geaendert("einsatz", [n.ein, n.fl, n.fzs, n.nav, n.gs, n.pats, n.patZu, s.einsatz2?.abfrage])) einsatzZeichnen(s);
  if (geaendert("buchen", [n.ent && JSON.stringify(n.ent), n.planT, n.amOrtText, !!n.ein])) buchenZeichnen(s);
  alarmZeichnen(s);
}
async function holen() {
