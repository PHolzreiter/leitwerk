<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1323">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LeitWerk Pilot</title>
<style>
  :root { --bg:#0b1323; --karte:#131d33; --karte2:#1a2742; --rand:rgba(150,185,235,.16); --text:#e9f0fb; --dim:#9db0c9; --akzent:#2f7cf6; --warn:#f5a524; --rot:#e53935; --ok:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; height:100dvh; }
  button { font:inherit; color:inherit; }
  /* Kopf und Seitenleiste */
  .kopf { display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 14px 6px; }
  .kopf b { font-size:18px; display:block; }
  .kopf small { color:var(--dim); font-size:12px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62vw; }
  .pill { margin-left:auto; font-size:12px; padding:4px 9px; border-radius:99px; background:rgba(34,197,94,.15); color:#4ade80; flex:none; }
  .pill.aus { background:rgba(245,165,36,.15); color:var(--warn); }
  .tabs { position:relative; display:grid; grid-template-columns:repeat(3,1fr); margin:0 10px; background:var(--karte); border-radius:12px; padding:4px; border:1px solid var(--rand); }
  .tabs button { position:relative; z-index:1; border:none; background:none; padding:9px 4px; font-size:15px; font-weight:700; color:var(--dim); border-radius:9px; }
  .tabs button.an { color:#fff; }
  .tabs button .punkt { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rot); margin-left:5px; vertical-align:middle; }
  .tabs .strich { position:absolute; z-index:0; top:4px; bottom:4px; left:4px; width:calc((100% - 8px) / 3); border-radius:9px; background:var(--akzent); transition:transform .25s; }
  .punkte { display:flex; justify-content:center; gap:6px; padding:6px 0 2px; }
  .punkte i { width:6px; height:6px; border-radius:50%; background:var(--rand); transition:background .2s, width .2s; }
  .punkte i.an { background:var(--akzent); width:16px; border-radius:3px; }
  /* Seiten zum Wischen */
  #seiten { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; }
  #seiten::-webkit-scrollbar { display:none; }
  .seite { flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }
  .karte { background:var(--karte); border:1px solid var(--rand); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:15px; line-height:1.4; }
  .karte h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .dim { color:var(--dim); font-size:13px; }
  .leer { color:var(--dim); text-align:center; padding:30px 10px; font-size:15px; }
  /* Funkgerät: Display */
  .geraet { background:linear-gradient(#22262d,#121418); border-radius:18px; padding:12px; border:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.4); margin-bottom:12px; }
  .lcd { background:linear-gradient(180deg,#c9d9f1,#aec4e6); color:#10141c; border-radius:8px; padding:8px 10px; min-height:112px; display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden; }
  .lcd .zeile1 { display:flex; justify-content:space-between; font-size:12px; font-weight:700; }
  .lcd .balken i { display:inline-block; width:3px; background:#2f8a2f; margin-right:1px; vertical-align:bottom; }
  .lcd .st { display:flex; align-items:center; gap:10px; margin-top:4px; }
  .lcd .st .n { font-size:42px; font-weight:800; line-height:1; min-width:36px; text-align:center; font-family:ui-monospace,Menlo,monospace; }
  .lcd .st .t { font-size:18px; font-weight:800; }
  .lcd .gr { font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:14px; }
  .lcd .alarmzeile { position:absolute; inset:0; background:#c62828; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px; animation:blink .8s infinite alternate; }
  .lcd .alarmzeile b { font-size:24px; letter-spacing:.12em; }
  .lcd .alarmzeile span { font-size:13px; font-weight:600; }
  .lcd .halte { position:absolute; left:0; bottom:0; height:5px; width:0; background:#2d5aa0; }
  .lcd .halte.an { width:100%; transition:width 2s linear; }
  @keyframes blink { to { filter:brightness(1.2); } }
  /* Tastenfeld */
  .tasten { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; }
  .taste { position:relative; border:none; border-radius:14px; height:66px; background:linear-gradient(#2c3139,#1b1f25); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 3px 0 #07090c; color:#f2f4f8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; }
  .taste .z { font-size:26px; font-weight:800; line-height:1; }
  .taste .w { font-size:11px; color:#aab4c4; max-width:96%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .taste.st { border-bottom:4px solid var(--f); }
  .taste.aktiv { background:linear-gradient(color-mix(in srgb,var(--f) 55%,#2c3139),color-mix(in srgb,var(--f) 35%,#1b1f25)); }
  .taste.leer { opacity:.45; }
  .taste:active, .taste.gedrueckt { transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 #07090c; }
  .taste .ring { position:absolute; left:0; bottom:0; height:4px; width:0; background:var(--f,#fff); }
  .taste.gedrueckt .ring { width:100%; transition:width 2s linear; }
  .hinweis { text-align:center; color:var(--dim); font-size:12px; margin:8px 0 0; }
  /* Sprechtaste */
  .ptt { width:100%; border:none; border-radius:16px; padding:16px 10px; margin-top:12px; min-height:76px; background:linear-gradient(#2c3139,#16191e); color:#fff; font-size:18px; font-weight:800; letter-spacing:.06em; touch-action:none; user-select:none; -webkit-user-select:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 0 #07090c; }
  .ptt small { display:block; font-weight:500; font-size:12px; opacity:.75; letter-spacing:0; }
  .ptt.an { background:var(--rot); transform:translateY(3px); box-shadow:0 1px 0 #07090c; }
  #kanal { text-align:center; margin:8px 0 0; }
  .flug { width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; background:var(--akzent); color:#fff; margin-top:10px; }
  /* Einsatz */
  .code { display:inline-block; font-family:ui-monospace,Menlo,monospace; font-weight:800; font-size:15px; padding:3px 9px; border-radius:7px; background:var(--karte2); border:1px solid var(--rand); }
  .stufe { display:inline-block; font-size:12px; font-weight:800; padding:3px 8px; border-radius:99px; background:var(--sf,#555); color:#111; margin-left:6px; }
  .stichwort { font-size:19px; font-weight:800; margin:8px 0 4px; line-height:1.25; }
  .zeile { display:flex; gap:8px; margin:6px 0; }
  .zeile .i { flex:none; width:20px; text-align:center; }
  .gs { background:rgba(245,165,36,.15); color:#fcd34d; border-radius:10px; padding:8px 10px; margin:8px 0; font-weight:600; }
  .mit { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .mit span { font-size:13px; padding:3px 8px; border-radius:99px; background:var(--karte2); }
  .mit i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .koord { width:100%; margin-top:8px; border:1px solid var(--rand); background:var(--karte2); border-radius:10px; padding:10px; text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  details.abfrage summary { font-weight:700; padding:4px 0; }
  details.abfrage div { padding:3px 0 3px 10px; border-left:2px solid var(--rand); font-size:14px; }
  /* Buchen */
  .schritt { display:flex; align-items:center; gap:8px; margin:14px 0 8px; font-weight:800; font-size:14px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .schritt span { width:22px; height:22px; border-radius:50%; background:var(--akzent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
  .wahl { width:100%; text-align:left; border:1px solid var(--rand); background:var(--karte); border-radius:14px; padding:14px; margin-bottom:8px; display:block; }
  .wahl b { display:block; font-size:16px; }
  .wahl small { color:var(--dim); font-size:13px; }
  .wahl.an { border-color:var(--akzent); background:color-mix(in srgb,var(--akzent) 22%,var(--karte)); }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }
  .seg button { border:1px solid var(--rand); background:var(--karte); border-radius:12px; padding:12px 4px; font-size:13px; font-weight:700; min-width:0; overflow-wrap:anywhere; }
  .seg button.an { background:var(--akzent); border-color:var(--akzent); color:#fff; }
  .seg button:disabled { opacity:.35; }
  .such { width:100%; font-size:17px; padding:13px 14px; border-radius:12px; border:1px solid var(--rand); background:var(--karte2); color:var(--text); }
  .chip { display:flex; align-items:center; gap:10px; background:color-mix(in srgb,var(--akzent) 20%,var(--karte)); border:1px solid var(--akzent); border-radius:12px; padding:12px; }
  .chip div { flex:1; }
  .chip b { display:block; font-size:16px; }
  .chip small { color:var(--dim); }
  .chip button { border:none; background:rgba(255,255,255,.1); border-radius:10px; width:40px; height:40px; font-size:18px; }
  .kh { width:100%; text-align:left; border:1px solid var(--rand); background:var(--karte); border-radius:14px; padding:13px 14px; margin-bottom:8px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; }
  .kh b { font-size:16px; }
  .kh .km { text-align:right; font-weight:800; }
  .kh .km small { display:block; color:var(--dim); font-weight:500; }
  .kh .tags { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:5px; }
  .kh .tags span { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--karte2); color:var(--dim); }
  .kh .tags span.passend { background:rgba(34,197,94,.18); color:#4ade80; }
  .kh .tags span.warn { background:rgba(245,165,36,.18); color:var(--warn); }
  .kh.an { border-color:var(--ok); background:color-mix(in srgb,var(--ok) 15%,var(--karte)); }
  .plan { background:color-mix(in srgb,var(--ok) 16%,var(--karte)); border:1px solid color-mix(in srgb,var(--ok) 45%,transparent); border-radius:12px; padding:10px 12px; font-weight:700; margin-bottom:6px; }
  /* Bestätigen */
  .blatt { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:10; }
  .blatt[hidden] { display:none; }
  .blatt > div { width:100%; background:var(--karte); border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .blatt b { font-size:18px; display:block; margin-bottom:4px; }
  .blatt .knoepfe { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-top:16px; }
  .blatt .knoepfe button { border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800; background:var(--karte2); }
  .blatt .knoepfe .ja { background:var(--ok); color:#06210f; }
</style>
</head>
<body>
<header class="kopf"><div><b id="heli">LeitWerk Pilot</b><small id="unter">verbinde …</small></div><span class="pill aus" id="verb">offline</span></header>
<nav class="tabs" id="tabs"><i class="strich"></i><button data-s="0" class="an">Funk</button><button data-s="1">Einsatz</button><button data-s="2">Buchen</button></nav>
<div class="punkte" id="punkte"><i class="an"></i><i></i><i></i></div>
<main id="seiten">
  <section class="seite" id="s-funk">
    <div class="geraet">
      <div class="lcd" id="lcd"></div>
      <div class="tasten" id="tasten"></div>
      <p class="hinweis">Statustaste ca. 2 Sekunden halten, bis „düt-düt-düt-düt“ kommt</p>
    </div>
    <div id="funk"></div>
    <p class="dim" id="kanal" hidden></p>
    <button class="flug" id="flug" hidden>Übungsflug</button>
  </section>
  <section class="seite" id="s-einsatz"><div id="einsatz"></div><div id="patient"></div></section>
  <section class="seite" id="s-buchen"><div id="buchen"></div></section>
</main>
<div class="blatt" id="blatt" hidden><div><b id="blatt-titel"></b><div class="dim" id="blatt-text"></div><div class="knoepfe"><button id="blatt-nein">Abbrechen</button><button class="ja" id="blatt-ja">Buchen</button></div></div></div>
<script>
const t = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const sig = {};
const geaendert = (k, wert) => { const j = JSON.stringify(wert); if (sig[k] === j) return false; sig[k] = j; return true; };
let stand = {};

async function senden(cmd) {
  try {
    await fetch(`/befehl?t=${encodeURIComponent(t)}`, { method: "POST", body: cmd });
    setTimeout(holen, 250);
  } catch (e) { $("verb").textContent = "offline"; $("verb").className = "pill aus"; }
}
const vib = (m) => { try { navigator.vibrate && navigator.vibrate(m); } catch {} };

// ---------------- Töne (wie am Funkgerät)
let ac = null;
function ton(folge) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    let z = ac.currentTime + 0.01;
    for (const [hz, d] of folge) {
      if (hz) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = hz;
        g.gain.setValueAtTime(0, z); g.gain.linearRampToValueAtTime(0.15, z + 0.004); g.gain.setValueAtTime(0.15, z + d - 0.004); g.gain.linearRampToValueAtTime(0, z + d);
        o.connect(g).connect(ac.destination); o.start(z); o.stop(z + d + 0.02);
      }
      z += d;
    }
  } catch {}
}
const tonDruck = () => ton([[1200, 0.07]]);
const tonGesendet = () => ton([[1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055]]);

// ---------------- Seiten zum Wischen
const seiten = $("seiten");
let seite = 0;
function zeigeSeite(i, sanft = true) {
  seiten.scrollTo({ left: i * seiten.clientWidth, behavior: sanft ? "smooth" : "auto" });
}
function seiteMarkieren() {
  const i = Math.round(seiten.scrollLeft / Math.max(1, seiten.clientWidth));
  if (i === seite) return;
  seite = i;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("an", Number(b.dataset.s) === i));
  document.querySelectorAll("#punkte i").forEach((p, k) => p.classList.toggle("an", k === i));
}
seiten.addEventListener("scroll", () => {
  const w = Math.max(1, seiten.clientWidth);
  document.querySelector("#tabs .strich").style.transform = `translateX(${(seiten.scrollLeft / w) * 100}%)`;
  seiteMarkieren();
}, { passive: true });
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => zeigeSeite(Number(b.dataset.s))));
window.addEventListener("resize", () => zeigeSeite(seite, false));

// ---------------- Funk: Display und Tastenfeld
const TASTEN = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"];
let halt = null;
function tastenBauen(knoepfe) {
  const box = $("tasten");
  box.innerHTML = "";
  const nachNr = {};
  for (const k of knoepfe || []) nachNr[k.nummer] = k;
  for (const z of TASTEN) {
    const k = nachNr[z];
    const b = document.createElement("button");
    b.className = "taste" + (k ? " st" + (k.aktiv ? " aktiv" : "") : " leer");
    if (k) b.style.setProperty("--f", k.farbe);
    b.innerHTML = `<span class="z">${esc(z)}</span><span class="w">${k ? esc(k.name) : "&nbsp;"}</span><i class="ring"></i>`;
    if (k) {
      const los = () => {
        if (!halt || halt.b !== b) return;
        clearTimeout(halt.timer);
        b.classList.remove("gedrueckt");
        $("lcd").querySelector(".halte")?.classList.remove("an");
        halt = null;
      };
      b.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        b.setPointerCapture?.(ev.pointerId);
        if (halt) los();
        tonDruck(); vib(25);
        b.classList.add("gedrueckt");
        $("lcd").querySelector(".halte")?.classList.add("an");
        const timer = setTimeout(() => {
          b.classList.remove("gedrueckt");
          $("lcd").querySelector(".halte")?.classList.remove("an");
          halt = null;
          tonGesendet(); vib([60, 40, 60, 40, 60, 40, 60]);
          senden(k.aktion);
        }, 2000);
        halt = { b, timer };
      });
      b.addEventListener("pointerup", los);
      b.addEventListener("pointercancel", los);
      b.addEventListener("contextmenu", (ev) => ev.preventDefault());
    } else b.addEventListener("pointerdown", () => { tonDruck(); vib(10); });
    box.appendChild(b);
  }
}
function lcdZeichnen(s) {
  const st = s.status;
  $("lcd").innerHTML = `<div class="zeile1"><span class="balken"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:13px"></i></span><span>TETRA · BOS</span></div>
    <div class="gr">${esc(s.gruppe || "")}</div>
    <div class="st"><span class="n">${st ? esc(st.nummer) : "–"}</span><span class="t">${st ? esc(st.name) : esc(s.hinweis || "kein Hubschrauber")}</span></div>
    ${s.alarm ? `<div class="alarmzeile"><b>ALARM</b><span>${s.alarmCode ? esc(s.alarmCode) + " · " : ""}${esc(s.alarm)}</span><span>9 = quittieren · 2 = abheben</span></div>` : ""}
    <i class="halte"></i>`;
}

// Sprechtaste (gedrückt halten)
function funkBauen(f) {
  const fb = $("funk");
  fb.innerHTML = "";
  for (const k of f?.knoepfe || []) {
    const b = document.createElement("button");
    b.className = "ptt";
    b.innerHTML = `🎙 SPRECHEN<small>gedrückt halten – „LEO von …“</small>`;
    let unten = false;
    const an = (ev) => { ev.preventDefault(); if (unten) return; unten = true; b.classList.add("an"); vib(20); b.setPointerCapture?.(ev.pointerId); senden(k.aktion + "_an"); };
    const aus = () => { if (!unten) return; unten = false; b.classList.remove("an"); senden(k.aktion + "_aus"); };
    b.addEventListener("pointerdown", an);
    b.addEventListener("pointerup", aus);
    b.addEventListener("pointercancel", aus);
    b.addEventListener("contextmenu", (ev) => ev.preventDefault());
    fb.appendChild(b);
  }
}

// ---------------- Einsatz
function einsatzZeichnen(s) {
  const e = s.einsatz2;
  const box = $("einsatz");
  if (!e) { box.innerHTML = `<div class="leer">Kein Einsatz.<br>Warte auf die Alarmierung durch die Leitstelle.</div>`; return; }
  const offen = box.querySelector("details.abfrage")?.open;
  box.innerHTML = `<div class="karte">
      <div><span class="dim">${esc(e.nummer)}</span></div>
      <div style="margin-top:6px">${e.code ? `<span class="code">${esc(e.code)}</span>` : `<span class="dim">Code folgt</span>`}${e.stufe ? `<span class="stufe" style="--sf:${esc(e.stufeFarbe)}">${esc(e.stufe)}</span>` : ""}</div>
      <div class="stichwort">${esc(e.stichwort)}</div>
      ${e.info ? `<div class="gs">${esc(e.info)}</div>` : ""}
      <div class="zeile"><span class="i">📍</span><div>${esc(e.adresse)}${e.zusatz ? `<div class="dim">${esc(e.zusatz)}</div>` : ""}</div></div>
      ${e.km ? `<div class="zeile"><span class="i">✈</span><div>${esc(e.km)}${e.ankunft ? `<div class="dim">${esc(e.ankunft)}</div>` : ""}</div></div>` : ""}
      ${e.ziel ? `<div class="zeile"><span class="i">🏥</span><div>Ziel: <b>${esc(e.ziel)}</b></div></div>` : ""}
      ${e.plan ? `<div class="plan">${esc(e.plan)}</div>` : ""}
      ${e.koord ? `<button class="koord" id="koord">${esc(e.koord)}<div class="dim">Tippen zum Kopieren</div></button>` : ""}
      ${e.mit?.length ? `<div class="mit">${e.mit.map((m) => `<span><i style="background:${esc(m.farbe)}"></i>${esc(m.name)}${m.du ? " (du)" : ""}</span>`).join("")}</div>` : ""}
    </div>
    ${e.abfrage?.length ? `<div class="karte"><details class="abfrage"${offen ? " open" : ""}><summary>Notrufabfrage (${e.abfrage.length} Angaben)</summary>${e.abfrage.map((z) => `<div>${esc(z)}</div>`).join("")}</details></div>` : ""}`;
  $("koord")?.addEventListener("click", () => { navigator.clipboard?.writeText(e.koord).then(() => vib(20)); });
}
function patientZeichnen(s) {
  const p = $("patient");
  p.innerHTML = s.patient ? `<div class="karte"><h3>Patient</h3>${s.patient.map((x) => `<div>${esc(x)}</div>`).join("")}</div>` : s.einsatz2 ? `<div class="karte dim">Was der Patient hat, siehst du am Berufungsort (Status 3).</div>` : "";
}

// ---------------- Buchen
let suchFeld = null;
let suchTimer = 0;
function buchenZeichnen(s) {
  const b = s.buchung;
  const box = $("buchen");
  const fokus = document.activeElement === suchFeld;
  if (!b) { box.innerHTML = `<div class="leer">Kein Einsatz – nichts zu buchen.</div>`; suchFeld = null; return; }
  if (!b.da) { box.innerHTML = `${b.plan ? `<div class="plan">${esc(b.plan)}</div>` : ""}<div class="leer">${esc(b.text)}</div>`; suchFeld = null; return; }
  let h = b.plan ? `<div class="plan">✓ ${esc(b.plan)}</div><div class="dim">Ändern geht, solange ihr am Berufungsort seid.</div>` : "";
  h += `<div class="schritt"><span>1</span>Was passiert?</div>`;
  h += b.seiten.map((x) => `<button class="wahl${b.seite === x.id ? " an" : ""}" data-seite="${esc(x.id)}"><b>${esc(x.titel)}</b><small>${esc(x.text)}</small></button>`).join("");
  if (b.seite === "kein") {
    h += `<div class="schritt"><span>2</span>Grund</div>`;
    h += [["kein", "Patient bleibt vor Ort", "kein Transport nötig"], ["revers", "Transportverweigerung", "Revers unterschrieben"], ["tot", "Patient verstorben", "Tod durch den Notarzt festgestellt"]]
      .map(([g, t1, t2]) => `<button class="wahl${b.kein === g ? " an" : ""}" data-kein="${g}"><b>${t1}</b><small>${t2}</small></button>`).join("");
  } else if (b.seite !== "nah" && !b.rtw) {
    h += `<div class="karte dim">Noch kein RTW im Einsatz – bitte bei der Leitstelle anfordern.</div>`;
  } else {
    h += `<div class="schritt"><span>2</span>Stichwort</div>`;
    h += b.sym ? `<div class="chip"><div><b>${esc(b.sym.name)}</b><small>${esc(b.sym.kat)}</small></div><button data-symweg="1" aria-label="anderes Stichwort">✕</button></div>` : `<div id="suchplatz"></div>${b.treffer.map((x) => `<button class="wahl" data-sym="${esc(x.id)}"><b>${esc(x.name)}</b><small>${esc(x.kat)}</small></button>`).join("")}${b.q && !b.treffer.length ? `<div class="dim">Kein Stichwort gefunden.</div>` : ""}`;
    h += `<div class="schritt"><span>3</span>Alter</div><div class="seg">${b.alterListe.map((a) => `<button data-alter="${a.id}" class="${b.alter === a.id ? "an" : ""}">${esc(a.name)}</button>`).join("")}</div>`;
    h += `<div class="schritt"><span>4</span>Dringlichkeit</div><div class="seg">${b.dringListe.map((d) => `<button data-dring="${d.id}" class="${b.dring === d.id ? "an" : ""}"${d.aus ? " disabled" : ""}>${esc(d.name)}</button>`).join("")}</div>`;
    h += `<div class="schritt"><span>5</span>Krankenhaus</div>`;
    h += !b.sym ? `<div class="dim">Stichwort wählen – dann kommen die passenden Häuser, die jetzt aufnehmen.</div>` : b.kh.length ? b.kh.map((k) => `<button class="kh${k.an ? " an" : ""}" data-kh="${esc(k.id)}" data-name="${esc(k.name)}" data-lang="${esc(k.lang)}"><b>${esc(k.name)}</b><span class="km">${esc(k.km)}${k.zeit ? `<small>${esc(k.zeit)}</small>` : ""}</span><span class="tags">${k.tags.map((x) => `<span class="${x === "passend" ? "passend" : /voll|kein/.test(x) ? "warn" : ""}">${esc(x)}</span>`).join("")}</span></button>`).join("") : `<div class="dim">Kein passendes Haus nimmt gerade auf.</div>`;
  }
  box.innerHTML = h;
  // Suchfeld bleibt dasselbe (Tastatur bleibt offen)
  const platz = box.querySelector("#suchplatz");
  if (platz) {
    if (!suchFeld) {
      suchFeld = document.createElement("input");
      suchFeld.className = "such";
      suchFeld.placeholder = "Stichwort suchen (z. B. Schlaganfall)";
      suchFeld.enterKeyHint = "search";
      suchFeld.addEventListener("input", () => { clearTimeout(suchTimer); suchTimer = setTimeout(() => senden("bu:q:" + suchFeld.value), 250); });
      suchFeld.value = b.q || "";
    }
    platz.appendChild(suchFeld);
    if (fokus) suchFeld.focus();
  } else suchFeld = null;
  box.querySelectorAll("[data-seite]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:seite:" + x.dataset.seite); }));
  box.querySelectorAll("[data-kein]").forEach((x) => x.addEventListener("click", () => fragen(x.querySelector("b").textContent, "Kein Transport – so an die Leitstelle melden?", "Melden", () => senden("bu:kein:" + x.dataset.kein))));
  box.querySelectorAll("[data-sym]").forEach((x) => x.addEventListener("click", () => { vib(15); suchFeld?.blur(); senden("bu:sym:" + x.dataset.sym); }));
  box.querySelectorAll("[data-symweg]").forEach((x) => x.addEventListener("click", () => senden("bu:symweg")));
  box.querySelectorAll("[data-alter]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:alter:" + x.dataset.alter); }));
  box.querySelectorAll("[data-dring]").forEach((x) => x.addEventListener("click", () => { vib(15); senden("bu:dring:" + x.dataset.dring); }));
  box.querySelectorAll("[data-kh]").forEach((x) => x.addEventListener("click", () => fragen(x.dataset.name, x.dataset.lang, "Buchen", () => senden("bu:kh:" + x.dataset.kh))));
}
function fragen(titel, text, ja, f) {
  $("blatt-titel").textContent = titel;
  $("blatt-text").textContent = text;
  $("blatt-ja").textContent = ja;
  $("blatt").hidden = false;
  $("blatt-ja").onclick = () => { $("blatt").hidden = true; vib(30); f(); };
  $("blatt-nein").onclick = () => { $("blatt").hidden = true; };
}

// ---------------- Alarm: auf „Einsatz“ springen, vibrieren bis quittiert (höchstens 1 Minute)
let alarmVorher = "";
let vibTimer = 0;
function alarmPruefen(s) {
  const a = s.alarm ? (s.alarmCode || "") + s.alarm : "";
  if (a && a !== alarmVorher) {
    zeigeSeite(1);
    const start = Date.now();
    clearInterval(vibTimer);
    vib([500, 200, 500, 200, 500]);
    vibTimer = setInterval(() => {
      if (!stand.alarm || Date.now() - start > 60000) { clearInterval(vibTimer); vib(0); return; }
      vib([500, 200, 500, 200, 500]);
    }, 2600);
  }
  if (!a) { clearInterval(vibTimer); }
  alarmVorher = a;
  // Punkt auf dem Reiter „Einsatz“ bei Alarm
  const tb = document.querySelector('#tabs button[data-s="1"]');
  tb.innerHTML = "Einsatz" + (s.alarm ? '<span class="punkt"></span>' : "");
}

function zeichnen(s) {
  stand = s;
  if (geaendert("kopf", [s.heli, s.unter])) { $("heli").textContent = s.heli || "LeitWerk Pilot"; $("unter").textContent = s.unter || ""; }
  if (geaendert("lcd", [s.status, s.gruppe, s.alarm, s.alarmCode, s.hinweis])) lcdZeichnen(s);
  if (!halt && geaendert("tasten", s.knoepfe)) tastenBauen(s.knoepfe);
  if (geaendert("funk", s.funk?.knoepfe || [])) funkBauen(s.funk);
  const kn = $("kanal");
  kn.hidden = !s.funk?.kanal;
  kn.textContent = s.funk?.kanal || "";
  const f = $("flug");
  f.hidden = !s.flug;
  if (s.flug) { f.textContent = s.flug; f.onclick = () => { vib(20); senden("fliegen"); }; }
  if (geaendert("einsatz", s.einsatz2)) einsatzZeichnen(s);
  if (geaendert("patient", [s.patient, !!s.einsatz2])) patientZeichnen(s);
  if (geaendert("buchen", s.buchung)) buchenZeichnen(s);
  alarmPruefen(s);
}
async function holen() {
  try {
    const r = await fetch(`/stand?t=${encodeURIComponent(t)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    zeichnen(await r.json());
    $("verb").textContent = "verbunden"; $("verb").className = "pill";
  } catch (e) {
    $("verb").textContent = "offline"; $("verb").className = "pill aus";
  }
}
holen();
setInterval(holen, 1000);
try { navigator.wakeLock?.request("screen")?.catch(() => {}); } catch {}
