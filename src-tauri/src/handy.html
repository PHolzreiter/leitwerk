  Eigenständige Seite (ohne Vite), vom Programm ausgeliefert (handy.rs): holt den Stand von /stand (jede Sekunde) und schickt

<body>

<nav class="tabs" id="tabs">
  <button class="tab an" data-tab="einsaetze"><span class="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a6 6 0 0 0-6 6v4.2L4.3 16a1 1 0 0 0 .9 1.5h13.6a1 1 0 0 0 .9-1.5L18 13.2V9a6 6 0 0 0-6-6zm-2.3 16a2.4 2.4 0 0 0 4.6 0z"/></svg></span>Einsätze</button>

<script>
const t = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const IC = { zur: '<svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>', senden: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 20.5 21 12 3 3.5l2.5 7L15 12l-9.5 1.5z"/></svg>' };

// ---------------- Einstellungen am Gerät (nur hier gespeichert)
const PREF = (() => { try { return JSON.parse(localStorage.getItem("lw-handy") || "{}"); } catch { return {}; } })();
const pref = (k, d) => (k in PREF ? PREF[k] : d);
const prefSetzen = (k, v) => { PREF[k] = v; try { localStorage.setItem("lw-handy", JSON.stringify(PREF)); } catch {} };

// ---------------- Verbindung, Töne, Vibration
let stand = {};
let online = false;
async function senden(cmd) {
  try { await fetch(`/befehl?t=${encodeURIComponent(t)}`, { method: "POST", body: cmd }); setTimeout(holen, 250); }
  catch (e) { online = false; kopf(); }
}
const vib = (m) => { if (!pref("vib", true) && m !== 0) return; try { navigator.vibrate && navigator.vibrate(m); } catch {} };
let ac = null;
function ton(folge) {
  if (!pref("toene", true)) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();

      z += d;

}
const tonDruck = () => ton([[1200, 0.07]]);
const tonGesendet = () => ton([[1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055], [0, 0.045], [1600, 0.055]]);
let toastT = 0;
function toast(text) { const b = $("toast"); b.querySelector("span").textContent = text; b.hidden = false; const s = b.querySelector("span"); s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; clearTimeout(toastT); toastT = setTimeout(() => (b.hidden = true), 2200); }

// ---------------- Code-Marke je Versorgungsstufe (Kopie von src/ui/fenster/pilot/marke.js)
function marke(stufe) {
  const s = String(stufe || "");
  const C = { rot: "#d32f2f", orange: "#f57c00", gelb: "#fbc02d", "grün": "#2e9d4a" }, HELL = { rot: "#f2a7a7", orange: "#ffcc99", gelb: "#fde68a", "grün": "#a9dcb6" }, TXT = { rot: "#ffffff", orange: "#15181c", gelb: "#15181c", "grün": "#ffffff" };
  const f = Object.keys(C).find((k) => s.indexOf(k) >= 0), W = "background:#ffffff;color:#15181c;padding:1px 7px;";
  if (/^ALS/.test(s) && f) return { a: `background:${C[f]};padding:4px 10px;`, i: `color:${TXT[f]};` };
  if (/^BLS\/ALS/.test(s)) return { a: "background:repeating-linear-gradient(135deg,#7d64cc 0 5px,#d9d0f7 5px 9px);padding:3px;", i: "background:#7d64cc;color:#ffffff;padding:1px 7px;" };
  if (/^BLS/.test(s) && f) return { a: `background:repeating-linear-gradient(135deg,${C[f]} 0 5px,${HELL[f]} 5px 9px);padding:3px;`, i: W };
  if (/^Sekundär.*sofort/.test(s)) return { a: "border:2px solid #b4232a;background:repeating-linear-gradient(90deg,#fde3e3 0 6px,#ffffff 6px 12px);padding:2px 8px;", i: "color:#8f1b21;" };
  if (/^Sekundär/.test(s)) return { a: "border:2px solid #2f6fb5;background:#e8f0fa;padding:2px 8px;", i: "color:#1f4f8a;" };
  if (/^Akut/.test(s)) return { a: "background:radial-gradient(#3a9c8f 1.7px,#cdebe7 2px) 0 0/6px 6px;padding:3px;", i: W };
  if (/^Telemed/.test(s)) return { a: "border:2px dashed #2563eb;background:#eef3fe;padding:2px 8px;", i: "color:#1d4ed8;" };
  if (/^Weitergabe/.test(s)) return { a: "border:2px dotted #6b7280;background:#f3f5f8;padding:2px 8px;", i: "color:#374151;" };
  if (/^Gro(ß|ss)/.test(s)) return { a: "background:repeating-linear-gradient(45deg,#475569 0 6px,#fbc02d 6px 12px);padding:3px;", i: W };
  if (/^Alpin/.test(s)) return { a: "background:linear-gradient(135deg,#8d6e63 0 60%,#5d4037 60%);padding:4px 10px;", i: "color:#ffffff;" };
  return { a: "background:#6b7280;padding:4px 10px;", i: "color:#ffffff;" };
}
const mkHtml = (code, stufe, gross) => { const m = marke(stufe); return `<span class="mk" style="${m.a}${gross ? "font-size:15px;" : ""}"><span style="${m.i}">${esc(code)}</span></span>`; };

// ---------------- Ansicht (nur hier): Reiter, offener Einsatz, Buchen-Schritt, gewählter Status
const A = { tab: "einsaetze", sel: "", buchen: false, bs: "art", khWahl: "", wahl: "", gesendet: "", abf: {}, anim: "" };
let letzteAkt = "";
function geh(neu, anim) { Object.assign(A, neu); A.anim = anim || ""; zeichnen(true); }
document.querySelectorAll("#tabs .tab").forEach((b) => b.addEventListener("click", () => { vib(10); geh({ tab: b.dataset.tab, buchen: false, wahl: "", gesendet: "", sel: b.dataset.tab === "einsaetze" && A.tab === "einsaetze" ? "" : A.sel }, A.tab === b.dataset.tab ? "zur" : "tab"); }));
function zurueck() {
  vib(10);
  if (A.buchen) {
    const f = folge();
    if (A.bs === "manuell") return geh({ bs: "vorschlag" }, "zur");
    const i = f.indexOf(A.bs);
    return i > 0 ? geh({ bs: f[i - 1] }, "zur") : geh({ buchen: false }, "zur");

}
function folge() {
  const s = stand.neu?.ent?.seite || "nah";
  return s === "kein" ? ["art", "kein"] : s === "rtw" || s === "naMit" ? ["art", "wer", "alter", "symptom", "dring", "vorschlag"] : ["art", "alter", "symptom", "dring", "vorschlag"];
}

// ---------------- Kopf (immer gleich hoch)
function kopf() {

  $("k-slot").innerHTML = det || A.buchen ? `<button class="k-rund" id="k-zur" aria-label="Zurück">${IC.zur}</button>` : `<span class="k-rund" style="cursor:default">${esc((stand.heli || "LW").replace(/^NAH\s*/, "N").slice(0, 3))}</span>`;
  $("k-zur")?.addEventListener("click", zurueck);

  const st = n.st;

  const bal = $("k-bal");

  document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.toggle("an", b.dataset.tab === A.tab));
  const pkt = (!!n.alarm || !!n.abrufPunkt) && A.tab !== "einsaetze";
  const tb = document.querySelector('#tabs [data-tab="einsaetze"]');
  if (!!tb.querySelector(".pkt") !== pkt) { if (pkt) tb.insertAdjacentHTML("beforeend", '<i class="pkt"></i>'); else tb.querySelector(".pkt").remove(); }
}
const schrittNr = () => { const f = folge(); return (A.bs === "manuell" ? f.indexOf("vorschlag") : f.indexOf(A.bs)) + 1; };
function aktuellesItem() { const L = stand.neu?.liste || []; return A.sel ? L.find((e) => e.id === A.sel) || null : null; }

// ---------------- Einsätze: Liste
function listeHtml() {
  const n = stand.neu || {}, L = n.liste || [];
  let h = "";
  if (!stand.heli) h += `<section class="karte leer-k"><b>Kein Hubschrauber</b><span class="leise">Wähle am PC deinen Hubschrauber – dann kommen die Einsätze hierher.</span></section>`;

// ---------------- Einsatz: alle Infos
function detailsHtml(it) {

      ${g.zug ? `<div class="zug"><b style="background:${esc(g.zug.f)}">${esc(g.zug.p)}</b><span>${esc(g.zug.t)}</span></div>` : ""}

    ${akt && (n.fzs || []).length ? `<div class="chips">${n.fzs.map((f) => `<span class="fz" title="${esc(f.tip)}"><b style="background:${esc(f.f)}">${esc(f.s)}</b><span>${esc(f.t)}</span></span>`).join("")}</div>` : ""}

  // Zielort

  h += `<section class="karte"><span class="lbl">Patient</span>

  h += `<section class="karte"><span class="lbl">Einsatzverlauf · neueste oben</span><div class="ver">${verlauf.map((v) => v.abf
    ? `<div><code>${esc(v.z)}</code><div style="flex:1;min-width:0"><button class="abfk" data-abf="${esc(v.key)}">${esc(v.abfArt)} · ${v.abf.length} Zeilen ${A.abf[v.key] ? "▴" : "▾"}</button>${A.abf[v.key] ? `<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">${v.abf.map((x) => `<span>${esc(x.t)}</span>`).join("")}</div>` : ""}</div></div>`
    : `<div><code>${esc(v.z)}</code><span>${v.von ? `<b style="font-weight:600">${esc(v.von)}</b> · ` : ""}${esc(v.t)}</span></div>`).join("") || `<div class="leise">Noch keine Einträge.</div>`}</div></section>`;
  return h;
}

// ---------------- Zielort buchen, Schritt für Schritt (Befehle „bu:…“ an den PC)
let suchFeld = null, suchTimer = 0, suchArt = "";
const FARBE = { 10: ["#2e9d4a", "#ffffff"], 20: ["#f57c00", "#15181c"], 30: ["#d32f2f", "#ffffff"] };
function wahlHtml(o) {
  return `<button class="wahl${o.on ? " an" : ""}${o.farbe ? " farbig" : ""}" ${o.attr} style="${o.farbe ? `background:${o.farbe[0]};color:${o.farbe[1]};border-color:${o.farbe[0]};` : ""}"><span class="wt"><b>${esc(o.t)}</b>${o.d ? `<small>${esc(o.d)}</small>` : ""}${o.merk && o.merk.length ? `<span class="merk">${o.merk.map((m) => `<span class="${esc(m.c)}">${esc(m.t)}</span>`).join("")}</span>` : ""}</span>${o.r ? `<span class="wr">${esc(o.r)}</span>` : ""}</button>`;
}
function buchenHtml() {
  const E = stand.neu?.ent;
  if (!E) return `<section class="karte leer-k"><b>Buchen geht gerade nicht</b><span class="leise">${esc(stand.neu?.amOrtText || "Buchen geht am Einsatzort (Status 3).")}</span></section>`;
  const f = folge(), bs = A.bs;
  const aus = [];
  const w = (E.wahl || []).find((x) => x.on);
  const idx = bs === "manuell" ? f.indexOf("vorschlag") : f.indexOf(bs);
  if (w && idx > 0) aus.push(w.t);
  if (f.indexOf("alter") >= 0 && idx > f.indexOf("alter")) { const a = (E.altW || []).find((x) => x.on); if (a) aus.push(a.t); }
  if (f.indexOf("symptom") >= 0 && idx > f.indexOf("symptom") && E.schritte?.[1]?.wert !== "–") aus.push(E.schritte[1].wert);
  if (f.indexOf("dring") >= 0 && idx > f.indexOf("dring") && E.schritte?.[2]) aus.push(E.schritte[2].wert);
  let h = aus.length ? `<div class="auswahl">${aus.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : "";
  let frage = "", hinw = "", opts = [], suche = "", unten = "";
  if (bs === "art") { frage = "Transportart oder Endegrund"; opts = (E.wahl || []).map((x) => ({ t: x.t, d: x.d, on: x.on, attr: `data-seite="${esc(x.id)}"` })); }
  else if (bs === "kein") { frage = "Endegrund"; hinw = "Kein Transport – warum? Danach frei über Funk (6)."; opts = (E.keinWahl || []).map((x) => ({ t: x.t, d: x.s, on: x.on, attr: `data-kein="${esc(x.id)}"` })); }
  else if (bs === "wer") {
    frage = "Wer bucht das Krankenhaus?";
    if (E.rtwFehlt) hinw = "Noch kein RTW im Einsatz – bitte bei der Leitstelle anfordern (Funk).";
    else opts = [{ t: "Übergeben – RTW bucht selbst", d: "Der RTW wählt das Krankenhaus, ihr meldet euch danach frei (6)", on: !!E.rtwWahl?.on, attr: 'data-rtw="1"' }, { t: "Selbst buchen", d: "Du wählst das Krankenhaus, der RTW fährt hin", attr: 'data-selbst="1"' }];
  }
  else if (bs === "alter") { frage = "Wie alt ist der Patient?"; opts = (E.altW || []).map((x) => ({ t: x.t, d: x.s, on: x.on, attr: `data-alter="${esc(x.id)}"` })); }
  else if (bs === "symptom") {
    frage = "Symptom"; hinw = E.symHinweis || "";
    const tr = (E.symQ || "").trim() ? E.symW || [] : [];
    suche = `<div class="such${tr.length ? " auf" : ""}"><div id="suchplatz"></div>${tr.length ? `<div class="dd" role="listbox">${tr.map((x) => `<button data-sym="${esc(x.id)}"><b>${esc(x.t)}</b><small>${esc(x.kat || "")}</small></button>`).join("")}</div>` : ""}</div>`;
    const gew = E.schritte?.[1]?.wert;
    if (gew && gew !== "–" && !(E.symQ || "").trim()) opts = [{ t: gew, d: "gewählt – weiter mit der Dringlichkeit", on: true, attr: 'data-weiter="dring"' }];
  }
  else if (bs === "dring") { frage = "Dringlichkeit"; hinw = E.schritte?.[1]?.wert && E.schritte[1].wert !== "–" ? `Für „${E.schritte[1].wert}“ möglich:` : ""; opts = (E.drW || []).map((x) => ({ t: x.t, d: x.s, on: x.on, farbe: FARBE[x.id], attr: `data-dring="${esc(x.id)}"` })); }
  else if (bs === "vorschlag" || bs === "manuell") {
    const man = bs === "manuell";
    const liste = man ? E.khAndere || [] : E.khs || [];
    if (!liste.some((x) => x.id === A.khWahl)) A.khWahl = !man && E.gebuchtId && liste.some((x) => x.id === E.gebuchtId) ? E.gebuchtId : "";
    frage = man ? "Manuell buchen" : "Vorschläge";
    hinw = man ? "Krankenhaus eintippen – alle Häuser, ohne Vorschlag" : "passend zu Alter, Symptom und Dringlichkeit, nach Entfernung";
    if (man) suche = `<div class="such"><div id="suchplatz"></div></div>`;
    opts = liste.map((x, i) => ({ t: (man ? "" : i + 1 + " · ") + x.n, d: x.km + (x.min || ""), on: x.id === A.khWahl, r: E.gebuchtId === x.id ? "gebucht " + (E.gebuchtT || "") : "", attr: `data-kh="${esc(x.id)}"`,
      merk: [...(x.merk || []), ...(x.frei ? [{ t: x.frei, c: /rot/.test(x.freiCls || "") ? "rot" : /gelb/.test(x.freiCls || "") ? "gelb" : "ok" }] : [])] }));
    const leer = man ? ((E.andereQ || "").trim() && !liste.length ? "Nichts gefunden – anders eintippen." : "") : E.khLeer || "";
    if (leer) unten += `<div class="leise">${esc(leer)}</div>`;
    if (!man) unten += `<button class="knopf zweit" id="manuell">Manuell buchen – alle Krankenhäuser</button>`;
    const gw = liste.find((x) => x.id === A.khWahl);
    unten += `<div class="fest"><button class="knopf${gw && E.gebuchtId !== gw.id ? "" : " aus"}" id="kh-buchen">${gw ? (E.gebuchtId === gw.id ? esc(gw.n) + " ist gebucht" : esc(gw.n) + " buchen") : "Krankenhaus wählen"}</button><div class="leise" style="text-align:center;font-size:12px">Die Buchung belegt einen Platz im Krankenhaus – wie in der Leitstelle.</div></div>`;
  }
  h += `<h2 class="frage">${esc(frage)}</h2>${hinw ? `<p class="bh">${esc(hinw)}</p>` : ""}${suche}${opts.map(wahlHtml).join("")}${unten}`;
  return h;
}
function sucheEinhaengen() {
  const platz = $("suchplatz");
  const art = A.bs === "manuell" ? "mq" : "q";
  if (!platz) { suchFeld = null; return; }
  const E = stand.neu?.ent || {};
  if (!suchFeld || suchArt !== art) {
    suchFeld = document.createElement("input");
    suchFeld.className = "feld";
    suchFeld.enterKeyHint = "search";
    suchFeld.autocomplete = "off";
    suchFeld.placeholder = art === "mq" ? "Krankenhaus suchen, z. B. Tulln, AKH, Horn" : "Symptom eintippen, z. B. Atemnot, Brust";
    suchFeld.setAttribute("aria-label", suchFeld.placeholder);
    suchFeld.value = art === "mq" ? E.andereQ || "" : E.symQ || "";
    suchFeld.addEventListener("input", () => { clearTimeout(suchTimer); const v = suchFeld.value; suchTimer = setTimeout(() => senden(`bu:${art}:${v}`), 220); });
    suchFeld.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && art === "q") { const x = (stand.neu?.ent?.symW || [])[0]; if (x) { suchFeld.blur(); senden("bu:sym:" + x.id); geh({ bs: "dring" }, "vor"); } } });
    suchArt = art;
  }
  platz.replaceWith(suchFeld);
}
function fertig(text) { geh({ buchen: false, bs: "art", khWahl: "" }, "zur"); if (text) { toast(text); vib(30); } }

// ---------------- Status: antippen, dann „Senden“ (7 gibt es nicht: sichtbar, gesperrt)
function statusHtml() {
  const n = stand.neu || {}, st = n.st || {};
  const keys = n.alleSt || [];
  const tt = n.tetra || {};
  const kanal = stand.funk?.kanal || "Funk frei";
  const warn = /kein Großeinsatz/.test(kanal) ? kanal.replace(/^⚠\s*/, "").split(" · ")[0] : "";
  const wahl = keys.find((k) => k.nummer === A.wahl);
  let h = `<section class="lcd"><div class="z1"><span>TETRA · BOS</span><span>${esc(n.uhr || "")}</span></div>
    <div class="g"><button data-gr="-1" aria-label="Sprechgruppe zurück">‹</button><b>${esc(n.gruppe || "RD-NOE-03")}</b><button data-gr="1" aria-label="Sprechgruppe weiter">›</button></div>
    <div class="s"><b>${esc(st.n || "–")}</b>${esc(st.t || stand.hinweis || "kein Hubschrauber")}</div>
    ${tt.kopf ? `<div class="pop ${esc(tt.art || "")}"><b>${esc(tt.kopf)}</b><span>${esc(tt.wer || "")}</span><span>${esc(tt.popGruppe || "")}</span><span>${esc(tt.neben || "")}</span></div>` : ""}
  </section>`;
  if (warn) h += `<div class="warn">⚠ ${esc(warn)}</div>`;
  h += `<div class="kanal${stand.funk?.sendet ? " an" : ""}"><i></i><span>${esc(warn ? "Funk" : kanal)}</span></div>`;
  h += `<div class="lbl">Status wählen, dann senden</div><div class="tasten">`;
  for (const nr of ["1", "2", "3", "4", "5", "6", "7", "8", "9"]) {
    if (nr === "7") { h += `<span class="taste gesperrt" aria-disabled="true" title="Status 7 gibt es hier nicht"><b>7</b><span>–</span></span>`; continue; }
    const k = keys.find((x) => x.nummer === nr);
    if (!k) { h += `<span class="taste gesperrt"><b>${nr}</b></span>`; continue; }
    h += `<button class="taste${k.aktiv ? " ist" : ""}${A.wahl === nr ? " wahl-an" : ""}" data-st="${nr}" style="background:${esc(k.farbe)}" aria-pressed="${A.wahl === nr}"><b>${nr}</b><span>${esc(k.kurz)}</span></button>`;
  }
  h += `</div><button class="knopf${wahl ? "" : " aus"}" id="st-senden">${IC.senden}${wahl ? `Status ${esc(wahl.nummer)} senden` : "Status wählen"}</button>`;
  if (A.gesendet) h += `<div class="gesendet">Status ${esc(A.gesendet)} gesendet</div>`;
  return h;
}

// ---------------- Einstellungen (am Gerät; Rest am PC)
function einstHtml() {
  const sw = (k, d, t, h) => `<div class="ez"><span><b>${t}</b><small>${h}</small></span><button class="sw${pref(k, d) ? " an" : ""}" role="switch" aria-checked="${!!pref(k, d)}" data-pref="${k}" data-d="${d ? 1 : 0}"><i></i></button></div>`;
  return `<div class="lbl">Am Handy</div><section class="karte" style="gap:0">
      ${sw("vib", true, "Vibration", "beim Alarm, bis du quittierst (höchstens 1 Minute)")}
      ${sw("toene", true, "Tastentöne", "Druckton und „düt-düt-düt“ beim Senden")}
      ${sw("wach", true, "Bildschirm anlassen", "solange die Seite offen ist")}
    </section>
    ${stand.flug ? `<div class="lbl">Flug</div><section class="karte" style="gap:0"><div class="ez"><span><b>Übungsflug</b><small>ohne Flugsimulator, gerade Linie</small></span><button class="klein" id="flug">${esc(/^Anhalten/.test(stand.flug) ? "Anhalten" : "Starten")}</button></div><div class="leise" style="font-size:12px">${esc(stand.flug)}</div></section>` : ""}
    <div class="lbl">Verbindung</div><section class="karte" style="gap:0">
      <div class="ez"><span><b>LeitWerk am PC</b><small>${esc(stand.unter || stand.hinweis || "")}</small></span><span class="tag ${online ? "ok" : "rot"}">${online ? "verbunden" : "offline"}</span></div>
      <div class="ez"><span><b>Weitere Einstellungen</b><small>Funk, Tasten, Alarmtöne, Flugsimulator – am PC im Reiter „Einstellungen“</small></span></div>
    </section>`;
}

// ---------------- Alarm über die ganze Fläche: 9 Quittieren / 2 Abheben, vibrieren bis quittiert
let alarmVorher = "", vibTimer = 0;
function alarmZeichnen() {
  const n = stand.neu || {}, a = n.alarm;
  const box = $("alarm");
  box.hidden = !a;
  if (a) {
    const it = (n.liste || []).find((x) => x.laeuft) || {};
    const k = (n.alleSt || []);
    const q = k.find((x) => x.nummer === "9"), h2 = k.find((x) => x.nummer === "2");
    const html = `<div class="a1"><span>ALARM</span><span>${esc(n.uhr || "")} · ${esc(stand.heli || "")}</span></div>
      <div>${it.code ? mkHtml(it.code, it.stufe, true) : ""}</div>
      <div class="at">${esc(it.sw || a.t)}</div><div class="as">${esc(a.s)}</div>
      ${a.ziB || a.ziT ? `<div class="azi">${a.ziB ? `<b>${esc(a.ziB)}</b>` : ""}${a.ziB && a.ziT ? " // " : ""}${esc(a.ziT)}</div>` : ""}
      <div class="mel"><i></i>Melder läuft bis 9 oder 2</div>
      <div class="ak"><button class="q" data-al="${esc(q?.aktion || "s9")}"><b>9</b>Quittieren</button><button class="h" data-al="${esc(h2?.aktion || "s2")}"><b>2</b>Abheben</button></div>`;
    if (box.dataset.k !== html) { box.innerHTML = html; box.dataset.k = html; box.querySelectorAll("[data-al]").forEach((b) => b.addEventListener("click", () => { tonGesendet(); vib(40); senden(b.dataset.al); box.hidden = true; geh({ tab: "einsaetze", sel: (n.liste || []).find((x) => x.laeuft)?.id || "" }, "tab"); })); }
  }
  const key = a ? a.t + a.s : "";
  if (key && key !== alarmVorher) {
    const start = Date.now();
    clearInterval(vibTimer);
    vib([500, 200, 500, 200, 500]);
    vibTimer = setInterval(() => { if (!stand.neu?.alarm || Date.now() - start > 60000) { clearInterval(vibTimer); vib(0); return; } vib([500, 200, 500, 200, 500]); }, 2600);
  }
  if (!key) clearInterval(vibTimer);
  alarmVorher = key;
}

// ---------------- Zeichnen: nur neu aufbauen, wenn sich etwas Sichtbares geändert hat
let letzteSeite = "";
function zeichnen(ansichtWechsel) {
  const n = stand.neu || {};
  // neuer laufender Einsatz: gleich öffnen
  if ((n.aktId || "") !== letzteAkt) { letzteAkt = n.aktId || ""; if (letzteAkt) { A.sel = letzteAkt; A.buchen = false; } }
  if (A.sel && !(n.liste || []).some((e) => e.id === A.sel)) A.sel = "";
  if (A.buchen && !n.ent) A.buchen = false;
  kopf();
  alarmZeichnen();
  const it = aktuellesItem();
  let html = "";
  if (A.tab === "status") html = statusHtml();
  else if (A.tab === "einst") html = einstHtml();
  else if (A.buchen) html = buchenHtml();
  else if (it) html = detailsHtml(it);
  else html = listeHtml();
  const seite = $("seite");
  const schluessel = A.tab + "|" + A.sel + "|" + A.buchen + "|" + A.bs;
  if (html !== letzteSeite || ansichtWechsel) {
    const fokus = document.activeElement === suchFeld;
    seite.innerHTML = html;
    letzteSeite = html;
    sucheEinhaengen();
    if (fokus && suchFeld) suchFeld.focus();
    verdrahten();
  }
  if (ansichtWechsel) {
    seite.className = A.anim ? "an-" + A.anim : "";
    if (A.anim) { void seite.offsetWidth; }
    $("inhalt").scrollTop = 0;
  }
  $("ptt-leiste").hidden = A.tab !== "status" || !(stand.funk?.knoepfe || []).length;
  $("ptt-t").textContent = `gedrückt halten – „LEO von ${stand.heli || "…"}“ · ${n.gruppe || ""}`;
  zeichnen.k = schluessel;
}
function verdrahten() {
  const s = $("seite");
  s.querySelectorAll("[data-e]").forEach((b) => b.addEventListener("click", () => { vib(10); geh({ sel: b.dataset.e }, "vor"); }));
  s.querySelectorAll("[data-kc]").forEach((b) => b.addEventListener("click", () => { navigator.clipboard?.writeText(b.dataset.kc).then(() => { vib(20); toast("Koordinaten kopiert"); }).catch(() => toast(b.dataset.kc)); }));
  s.querySelectorAll("[data-abf]").forEach((b) => b.addEventListener("click", () => { A.abf[b.dataset.abf] = !A.abf[b.dataset.abf]; zeichnen(false); }));
  $("buchen-auf")?.addEventListener("click", () => { vib(15); geh({ buchen: true, bs: "art", khWahl: "" }, "vor"); });
  // Buchen
  s.querySelectorAll("[data-seite]").forEach((b) => b.addEventListener("click", () => { vib(15); const id = b.dataset.seite; senden("bu:seite:" + id); stand.neu.ent.seite = id; geh({ bs: id === "kein" ? "kein" : id === "rtw" || id === "naMit" ? "wer" : "alter" }, "vor"); }));
  s.querySelectorAll("[data-kein]").forEach((b) => b.addEventListener("click", () => { senden("bu:kein:" + b.dataset.kein); fertig("Endegrund gebucht – danach frei über Funk (6)"); }));
  s.querySelector("[data-rtw]")?.addEventListener("click", () => { senden("bu:rtwbucht"); fertig("Übergabe gebucht – der RTW bucht selbst"); });
  s.querySelector("[data-selbst]")?.addEventListener("click", () => { vib(15); geh({ bs: "alter" }, "vor"); });
  s.querySelectorAll("[data-alter]").forEach((b) => b.addEventListener("click", () => { vib(15); senden("bu:alter:" + b.dataset.alter); geh({ bs: "symptom" }, "vor"); }));
  s.querySelectorAll("[data-sym]").forEach((b) => b.addEventListener("click", () => { vib(15); suchFeld?.blur(); senden("bu:sym:" + b.dataset.sym); geh({ bs: "dring" }, "vor"); }));
  s.querySelector("[data-weiter]")?.addEventListener("click", () => geh({ bs: "dring" }, "vor"));
  s.querySelectorAll("[data-dring]").forEach((b) => b.addEventListener("click", () => { vib(15); senden("bu:dring:" + b.dataset.dring); geh({ bs: "vorschlag" }, "vor"); }));
  s.querySelectorAll("[data-kh]").forEach((b) => b.addEventListener("click", () => { vib(10); A.khWahl = b.dataset.kh; zeichnen(false); }));
  $("manuell")?.addEventListener("click", () => { vib(10); geh({ bs: "manuell", khWahl: "" }, "vor"); });
  $("kh-buchen")?.addEventListener("click", () => {
    const E = stand.neu?.ent; if (!E) return;
    const gw = [...(E.khs || []), ...(E.khAndere || [])].find((x) => x.id === A.khWahl);
    if (!gw || E.gebuchtId === gw.id) return;
    senden("bu:kh:" + gw.id); fertig(gw.n + " gebucht – Platz belegt");
  });
  // Status
  s.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => { tonDruck(); vib(15); A.wahl = A.wahl === b.dataset.st ? "" : b.dataset.st; A.gesendet = ""; zeichnen(false); }));
  $("st-senden")?.addEventListener("click", () => {
    const k = (stand.neu?.alleSt || []).find((x) => x.nummer === A.wahl);
    if (!k) return;
    tonGesendet(); vib([60, 40, 60, 40, 60]); senden(k.aktion);
    A.gesendet = k.nummer; A.wahl = ""; zeichnen(false);
    setTimeout(() => { A.gesendet = ""; zeichnen(false); }, 3000);
  });
  s.querySelectorAll("[data-gr]").forEach((b) => b.addEventListener("click", () => { vib(15); senden("gr:" + b.dataset.gr); }));
  // Einstellungen
  s.querySelectorAll("[data-pref]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.pref; prefSetzen(k, !pref(k, b.dataset.d === "1")); if (k === "wach") wachHalten(); zeichnen(false); }));
  $("flug")?.addEventListener("click", () => { vib(20); senden("fliegen"); });
}

// Sprechtaste (gedrückt halten; solange gedrückt jede Sekunde ein Lebenszeichen)
(() => {
  const b = $("ptt");
  let unten = false, lebt = null;
  const an = (ev) => { ev.preventDefault(); if (unten) return; unten = true; b.classList.add("an"); b.querySelector("b").textContent = "DU SPRICHST"; vib(20); b.setPointerCapture?.(ev.pointerId); senden("funk_an"); lebt = setInterval(() => senden("funk_halt"), 1000); };
  const aus = () => { if (!unten) return; unten = false; clearInterval(lebt); lebt = null; b.classList.remove("an"); b.querySelector("b").textContent = "SPRECHEN"; senden("funk_aus"); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) aus(); });
  b.addEventListener("pointerdown", an);
  b.addEventListener("pointerup", aus);
  b.addEventListener("pointercancel", aus);
  b.addEventListener("contextmenu", (ev) => ev.preventDefault());
})();

let sperre = null;
function wachHalten() { try { if (pref("wach", true)) navigator.wakeLock?.request("screen").then((l) => (sperre = l)).catch(() => {}); else { sperre?.release?.(); sperre = null; } } catch {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) wachHalten(); });

async function holen() {
  try {
    const r = await fetch(`/stand?t=${encodeURIComponent(t)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    stand = await r.json();
    online = true;
  } catch (e) { online = false; }
  zeichnen(false);
}
holen();
setInterval(holen, 1000);
wachHalten();
