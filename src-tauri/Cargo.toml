[package]
name = "leitwerk"
version = "0.44.0"
description = "LeitWerk – privater Leitstellensimulator"
edition = "2021"

[lib]
name = "leitwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tauri-plugin-updater = "2.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
# Spracherkennung (whisper.cpp, läuft lokal)
whisper-rs = "0.14"
# Mikrofon und Tonausgabe direkt im Programm (Gerätewahl; das Fenster darf es auf dem Mac nicht)
cpal = "0.15"
# Entpacken der Stimmen-Pakete
bzip2 = "0.4"
tar = "0.4"
# zip: die Versionen 2.x und 4.x wurden auf crates.io zurückgezogen (Okt. 2026) – siehe [patch] unten
zip = { version = "4", default-features = false, features = ["deflate"] }
# Supertonic: ONNX Runtime wird zur Laufzeit geladen (nicht fest eingebaut)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
unicode-normalization = "0.1"

# Piper-Stimmen (sherpa-onnx): Mac und Windows fest eingebunden, Linux nur für die Prüfung
# Mac zusätzlich: Spracherkennung auf dem Grafikchip (Metal) – deutlich schneller
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries", "static"] }

# Windows: das fertige statische Paket enthält keine Sprachausgabe – daher als DLL (wird mit installiert)
[target.'cfg(windows)'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries"] }

# Spracherkennung schnell bauen (der Rest bleibt klein)
[profile.release.package.whisper-rs-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Der Updater braucht zip 4, das auf crates.io zurückgezogen wurde: direkt die Version 4.6.1 von GitHub verwenden.
# Entfernen, sobald tauri-plugin-updater eine nicht zurückgezogene zip-Version verwendet.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
