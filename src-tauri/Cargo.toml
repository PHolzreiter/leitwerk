[package]
name = "leitwerk"
version = "0.17.0"
description = "LeitWerk – privater Leitstellensimulator"
edition = "2021"

[lib]
name = "leitwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
# Spracherkennung (whisper.cpp, läuft lokal)
whisper-rs = "0.14"
# Mikrofon und Tonausgabe direkt im Programm (Gerätewahl; das Fenster darf es auf dem Mac nicht)
cpal = "0.15"
# Entpacken der Stimmen-Pakete
bzip2 = "0.4"
tar = "0.4"

# Piper-Stimmen (sherpa-onnx): Mac und Windows fest eingebunden, Linux nur für die Prüfung
# Mac zusätzlich: Spracherkennung auf dem Grafikchip (Metal) – deutlich schneller
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries", "static"] }

# Windows: das fertige statische Paket enthält keine Sprachausgabe – daher als DLL (wird mit installiert)
[target.'cfg(windows)'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries"] }

# Spracherkennung schnell bauen (der Rest bleibt klein)
[profile.release.package.whisper-rs-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
