# Relay für den LeitWerk-Multiplayer (Cloudflare Worker + Durable Objects, Gratis-Tarif).
# Wird per GitHub Action (.github/workflows/relay.yml) veröffentlicht.
name = "server"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
